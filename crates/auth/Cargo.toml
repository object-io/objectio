[package]
name = "objectio-auth"
description = "Authentication and authorization for ObjectIO"
version.workspace = true
edition.workspace = true
license.workspace = true

[features]
# OIDC/JWT authentication support
oidc = ["dep:jsonwebtoken", "dep:reqwest"]

[dependencies]
# Async support
async-trait = "0.1"

# Crypto for SigV4
hmac = { workspace = true }
sha2 = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
parking_lot = { workspace = true }
uuid = { workspace = true }
thiserror = { workspace = true }
tracing = { workspace = true }

# Time handling
chrono = "0.4"

# HTTP types
http = "1.2"

# Random generation
rand = { workspace = true }

# OIDC support (optional)
jsonwebtoken = { version = "9", optional = true }

# HTTP client for OIDC discovery and JWKS (optional)
reqwest = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
