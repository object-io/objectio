[package]
name = "objectio-storage"
description = "Raw disk storage engine for ObjectIO"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
objectio-common = { workspace = true }
objectio-erasure = { workspace = true }
tokio = { workspace = true }
bytes = { workspace = true }
serde = { workspace = true }
prost = { workspace = true }
thiserror = { workspace = true }
parking_lot = { workspace = true }
crc32c = { workspace = true }
xxhash-rust = { workspace = true }
tracing = { workspace = true }
serde_json = { workspace = true }
nix = { workspace = true }
libc = { workspace = true }
uuid = { workspace = true }
async-trait = { workspace = true }
crossbeam-channel = "0.5"
redb = { workspace = true }
# The RocksDB metadata engine (B27): optional, it is C++ and minutes of a
# cold build.
rocksdb = { version = "0.25", default-features = false, optional = true }

[build-dependencies]
# Not used here: it gives RocksDB's bindgen (0.72) the "runtime" feature.
# ISA-L's bindgen (0.71) has it by default, which puts the shared clang-sys
# in runtime-loading mode; RocksDB's bindgen, without it, then never loads
# libclang and its build panics ("a libclang shared library is not loaded
# on this thread"). With both features on, one binary can have both.
bindgen = { version = "0.72", features = ["runtime"], optional = true }

[dev-dependencies]
tempfile = { workspace = true }
rand = { workspace = true }

[features]
default = []
# The OSD's metadata index on RocksDB, selected with --meta-engine rocksdb.
rocksdb = ["dep:rocksdb", "dep:bindgen"]
# Compile the io_uring I/O backend in alongside the default pread one
# (Linux only; the flag silently does nothing on macOS / Windows).
# Opt-in because not every deployment target has a new-enough kernel
# (io_uring needs Linux 5.6+; we run on 5.15+ in practice).
#
# See src/io_backend.rs and docs at
# ../../../objectio-docs/architecture/design/core/storage-io-levels.md
# for the measured trade-offs.
io-uring = ["dep:tokio-uring"]

[target.'cfg(target_os = "linux")'.dependencies]
tokio-uring = { version = "0.5", optional = true }
