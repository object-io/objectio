[package]
name = "objectio-osd"
description = "Object Storage Daemon for ObjectIO"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
path = "src/lib.rs"


[dependencies]
objectio-common = { workspace = true }
objectio-storage = { workspace = true }
objectio-erasure = { workspace = true }
objectio-proto = { workspace = true }
objectio-block = { workspace = true }
objectio-transport-te = { workspace = true }
tokio = { workspace = true }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = { workspace = true }
axum = { workspace = true }
clap = { workspace = true }
config = { workspace = true }
tracing = { workspace = true }
nix = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
hex = { workspace = true }
uuid = { workspace = true }
parking_lot = { workspace = true }
crc32c = { workspace = true }
serde = { workspace = true }
prost = { workspace = true }
futures = { workspace = true }
toml = "0.8"
gethostname = "0.5"
sys-info = "0.9"

[features]
default = []
# Forwards ISA-L erasure coding (x86_64) to objectio-erasure.
isal = ["objectio-erasure/isal"]
# Opt-in: route shard I/O through io_uring instead of spawn_blocking
# + pread. Linux 5.6+ only; no-op on macOS / Windows. Measured +25%
# throughput on 4 MiB stripes (see objectio-docs storage-io-levels).
io-uring = ["objectio-storage/io-uring"]
# Accept shard transfers over Mooncake Transfer Engine (RDMA, or TCP in
# development). Linux only, and needs a Mooncake build — see
# crates/transport-te. Enabled at run time with `--rdma`.
rdma = ["objectio-transport-te/te"]

[dev-dependencies]
tempfile = { workspace = true }
