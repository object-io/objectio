[package]
name = "objectio-erasure"
description = "Erasure coding for ObjectIO: MDS on ISA-L, LRC"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
objectio-common = { workspace = true }
bytes = { workspace = true }
# A data shard a decode rebuilds is checked against the crc32c its stripe
# records for it before it is returned.
crc32c = { workspace = true }
thiserror = { workspace = true }

# MDS stripes, on every build: one code, so any node decodes any stripe.
# Bundles ISA-L's source and builds it: autoconf, automake, libtool and
# libclang on every target, NASM too on x86_64.
erasure-isa-l = { workspace = true }

# LRC global parity.
reed-solomon-simd = { workspace = true }

[dev-dependencies]
rand = { workspace = true }
