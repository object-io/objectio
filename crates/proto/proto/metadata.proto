syntax = "proto3";

package objectio.metadata;

import "block.proto";

// Metadata service for bucket and object operations
service MetadataService {
    // Bucket operations
    rpc CreateBucket(CreateBucketRequest) returns (CreateBucketResponse);
    // Reassign a bucket's owner. Also the backfill path for buckets created
    // before the gateway recorded a real owner.
    rpc SetBucketOwner(SetBucketOwnerRequest) returns (SetBucketOwnerResponse);
    // A bucket's byte and object quotas (0 = unlimited).
    rpc SetBucketQuota(SetBucketQuotaRequest) returns (SetBucketQuotaResponse);
    rpc DeleteBucket(DeleteBucketRequest) returns (DeleteBucketResponse);
    rpc GetBucket(GetBucketRequest) returns (GetBucketResponse);
    rpc ListBuckets(ListBucketsRequest) returns (ListBucketsResponse);

    // Object metadata operations
    rpc CreateObject(CreateObjectRequest) returns (CreateObjectResponse);
    rpc DeleteObject(DeleteObjectRequest) returns (DeleteObjectResponse);
    rpc GetObject(GetObjectRequest) returns (GetObjectResponse);
    rpc ListObjects(ListObjectsRequest) returns (ListObjectsResponse);

    // Placement
    rpc GetPlacement(GetPlacementRequest) returns (GetPlacementResponse);

    // Multipart upload
    rpc CreateMultipartUpload(CreateMultipartUploadRequest) returns (CreateMultipartUploadResponse);
    rpc GetMultipartUpload(GetMultipartUploadRequest) returns (GetMultipartUploadResponse);
    rpc RegisterPart(RegisterPartRequest) returns (RegisterPartResponse);
    rpc ListParts(ListPartsRequest) returns (ListPartsResponse);
    rpc CompleteMultipartUpload(CompleteMultipartUploadRequest) returns (CompleteMultipartUploadResponse);
    rpc AbortMultipartUpload(AbortMultipartUploadRequest) returns (AbortMultipartUploadResponse);
    rpc ListMultipartUploads(ListMultipartUploadsRequest) returns (ListMultipartUploadsResponse);

    // Bucket policy
    rpc SetBucketPolicy(SetBucketPolicyRequest) returns (SetBucketPolicyResponse);
    rpc GetBucketPolicy(GetBucketPolicyRequest) returns (GetBucketPolicyResponse);
    rpc DeleteBucketPolicy(DeleteBucketPolicyRequest) returns (DeleteBucketPolicyResponse);

    // OSD registration (for placement)
    rpc RegisterOsd(RegisterOsdRequest) returns (RegisterOsdResponse);

    // Get all active nodes for listing operations (scatter-gather)
    rpc GetListingNodes(GetListingNodesRequest) returns (GetListingNodesResponse);

    // Set operator-declared state for an OSD (In / Out / Draining).
    // Persisted via Raft and honoured by CRUSH on the next topology
    // rebuild — Out and Draining are excluded from new placements.
    rpc SetOsdAdminState(SetOsdAdminStateRequest) returns (SetOsdAdminStateResponse);

    // Snapshot of per-OSD drain progress kept in meta's in-memory map.
    // Returns one entry per currently-Draining OSD; empty response
    // means no drains in flight. Used by /_admin/drain-status.
    rpc GetDrainStatus(GetDrainStatusRequest) returns (GetDrainStatusResponse);

    // Cluster-wide rebalance progress. Populated by the reconciler
    // sweep that migrates shards whose current ShardLocation
    // disagrees with CRUSH's current pick. Consumed by
    // /_admin/rebalance-status.
    rpc GetRebalanceStatus(GetRebalanceStatusRequest) returns (GetRebalanceStatusResponse);

    // IAM operations (user/credential persistence)
    rpc CreateUser(CreateUserRequest) returns (CreateUserResponse);
    rpc GetUser(GetUserRequest) returns (GetUserResponse);
    rpc ListUsers(ListUsersRequest) returns (ListUsersResponse);
    rpc DeleteUser(DeleteUserRequest) returns (DeleteUserResponse);
    rpc CreateAccessKey(CreateAccessKeyRequest) returns (CreateAccessKeyResponse);
    rpc ListAccessKeys(ListAccessKeysRequest) returns (ListAccessKeysResponse);
    rpc DeleteAccessKey(DeleteAccessKeyRequest) returns (DeleteAccessKeyResponse);
    rpc GetAccessKeyForAuth(GetAccessKeyForAuthRequest) returns (GetAccessKeyForAuthResponse);
    // A key's record whatever its status, without its secret: for the admin
    // API to find whose key it is (GetAccessKeyForAuth refuses inactive ones).
    rpc GetAccessKey(GetAccessKeyRequest) returns (GetAccessKeyResponse);

    // Iceberg catalog operations
    rpc IcebergCreateNamespace(IcebergCreateNamespaceRequest) returns (IcebergCreateNamespaceResponse);
    rpc IcebergLoadNamespace(IcebergLoadNamespaceRequest) returns (IcebergLoadNamespaceResponse);
    rpc IcebergDropNamespace(IcebergDropNamespaceRequest) returns (IcebergDropNamespaceResponse);
    rpc IcebergListNamespaces(IcebergListNamespacesRequest) returns (IcebergListNamespacesResponse);
    rpc IcebergUpdateNamespaceProperties(IcebergUpdateNamespacePropertiesRequest) returns (IcebergUpdateNamespacePropertiesResponse);
    rpc IcebergNamespaceExists(IcebergNamespaceExistsRequest) returns (IcebergNamespaceExistsResponse);
    rpc IcebergCreateTable(IcebergCreateTableRequest) returns (IcebergCreateTableResponse);
    rpc IcebergLoadTable(IcebergLoadTableRequest) returns (IcebergLoadTableResponse);
    rpc IcebergCommitTable(IcebergCommitTableRequest) returns (IcebergCommitTableResponse);
    rpc IcebergCommitTransaction(IcebergCommitTransactionRequest) returns (IcebergCommitTransactionResponse);
    rpc IcebergDropTable(IcebergDropTableRequest) returns (IcebergDropTableResponse);
    rpc IcebergRenameTable(IcebergRenameTableRequest) returns (IcebergRenameTableResponse);
    rpc IcebergListTables(IcebergListTablesRequest) returns (IcebergListTablesResponse);
    rpc IcebergTableExists(IcebergTableExistsRequest) returns (IcebergTableExistsResponse);

    // Iceberg warehouse management
    rpc IcebergCreateWarehouse(IcebergCreateWarehouseRequest) returns (IcebergCreateWarehouseResponse);
    rpc IcebergListWarehouses(IcebergListWarehousesRequest) returns (IcebergListWarehousesResponse);
    rpc IcebergDeleteWarehouse(IcebergDeleteWarehouseRequest) returns (IcebergDeleteWarehouseResponse);

    // Iceberg table policy
    rpc IcebergSetTablePolicy(IcebergSetTablePolicyRequest) returns (IcebergSetTablePolicyResponse);
    rpc IcebergGetTablePolicy(IcebergGetTablePolicyRequest) returns (IcebergGetTablePolicyResponse);

    // Group management
    rpc CreateGroup(CreateGroupRequest) returns (CreateGroupResponse);
    rpc DeleteGroup(DeleteGroupRequest) returns (DeleteGroupResponse);
    rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
    rpc AddUserToGroup(AddUserToGroupRequest) returns (AddUserToGroupResponse);
    rpc RemoveUserFromGroup(RemoveUserFromGroupRequest) returns (RemoveUserFromGroupResponse);
    rpc GetUserGroups(GetUserGroupsRequest) returns (GetUserGroupsResponse);

    // Data filter management (column/row security)
    rpc CreateDataFilter(CreateDataFilterRequest) returns (CreateDataFilterResponse);
    rpc ListDataFilters(ListDataFiltersRequest) returns (ListDataFiltersResponse);
    rpc DeleteDataFilter(DeleteDataFilterRequest) returns (DeleteDataFilterResponse);
    rpc GetDataFiltersForPrincipal(GetDataFiltersForPrincipalRequest) returns (ListDataFiltersResponse);

    // Unity Catalog REST API backing — three-level (catalog.schema.table) lakehouse catalog
    rpc UnityCreateCatalog(UnityCreateCatalogRequest) returns (UnityCreateCatalogResponse);
    rpc UnityListCatalogs(UnityListCatalogsRequest)   returns (UnityListCatalogsResponse);
    rpc UnityGetCatalog(UnityGetCatalogRequest)       returns (UnityGetCatalogResponse);
    rpc UnityUpdateCatalog(UnityUpdateCatalogRequest) returns (UnityUpdateCatalogResponse);
    rpc UnityDeleteCatalog(UnityDeleteCatalogRequest) returns (UnityDeleteCatalogResponse);
    rpc UnityCreateSchema(UnityCreateSchemaRequest)   returns (UnityCreateSchemaResponse);
    rpc UnityListSchemas(UnityListSchemasRequest)     returns (UnityListSchemasResponse);
    rpc UnityGetSchema(UnityGetSchemaRequest)         returns (UnityGetSchemaResponse);
    rpc UnityUpdateSchema(UnityUpdateSchemaRequest)   returns (UnityUpdateSchemaResponse);
    rpc UnityDeleteSchema(UnityDeleteSchemaRequest)   returns (UnityDeleteSchemaResponse);
    rpc UnityCreateTable(UnityCreateTableRequest)     returns (UnityCreateTableResponse);
    rpc UnityListTables(UnityListTablesRequest)       returns (UnityListTablesResponse);
    rpc UnityGetTable(UnityGetTableRequest)           returns (UnityGetTableResponse);
    rpc UnityDeleteTable(UnityDeleteTableRequest)     returns (UnityDeleteTableResponse);
    rpc UnitySetTableSecurity(UnitySetTableSecurityRequest) returns (UnitySetTableSecurityResponse);
    rpc UnitySetCatalogPolicy(UnitySetCatalogPolicyRequest) returns (UnitySetCatalogPolicyResponse);
    rpc UnityGetCatalogPolicy(UnityGetCatalogPolicyRequest) returns (UnityGetCatalogPolicyResponse);
    rpc UnitySetSchemaPolicy(UnitySetSchemaPolicyRequest)   returns (UnitySetSchemaPolicyResponse);
    rpc UnityGetSchemaPolicy(UnityGetSchemaPolicyRequest)   returns (UnityGetSchemaPolicyResponse);
    rpc UnitySetTablePolicy(UnitySetTablePolicyRequest)     returns (UnitySetTablePolicyResponse);
    rpc UnityGetTablePolicy(UnityGetTablePolicyRequest)     returns (UnityGetTablePolicyResponse);
    // Functions / Volumes / Models — same catalog→schema→entity layout
    // as Tables. No nested policies (yet); the schema/catalog policy chain
    // applies.
    rpc UnityCreateFunction(UnityCreateFunctionRequest) returns (UnityCreateFunctionResponse);
    rpc UnityListFunctions(UnityListFunctionsRequest)   returns (UnityListFunctionsResponse);
    rpc UnityGetFunction(UnityGetFunctionRequest)       returns (UnityGetFunctionResponse);
    rpc UnityDeleteFunction(UnityDeleteFunctionRequest) returns (UnityDeleteFunctionResponse);
    rpc UnityCreateVolume(UnityCreateVolumeRequest) returns (UnityCreateVolumeResponse);
    rpc UnityListVolumes(UnityListVolumesRequest)   returns (UnityListVolumesResponse);
    rpc UnityGetVolume(UnityGetVolumeRequest)       returns (UnityGetVolumeResponse);
    rpc UnityDeleteVolume(UnityDeleteVolumeRequest) returns (UnityDeleteVolumeResponse);
    rpc UnityCreateModel(UnityCreateModelRequest) returns (UnityCreateModelResponse);
    rpc UnityListModels(UnityListModelsRequest)   returns (UnityListModelsResponse);
    rpc UnityGetModel(UnityGetModelRequest)       returns (UnityGetModelResponse);
    rpc UnityDeleteModel(UnityDeleteModelRequest) returns (UnityDeleteModelResponse);
    rpc UnityCreateModelVersion(UnityCreateModelVersionRequest) returns (UnityCreateModelVersionResponse);
    rpc UnityListModelVersions(UnityListModelVersionsRequest)   returns (UnityListModelVersionsResponse);
    rpc UnityGetModelVersion(UnityGetModelVersionRequest)       returns (UnityGetModelVersionResponse);
    rpc UnityUpdateModelVersionStatus(UnityUpdateModelVersionStatusRequest) returns (UnityUpdateModelVersionStatusResponse);
    rpc UnityDeleteModelVersion(UnityDeleteModelVersionRequest) returns (UnityDeleteModelVersionResponse);

    // Delta Sharing protocol — share, schema (namespace), table, and recipient management
    rpc DeltaCreateShare(DeltaCreateShareRequest)         returns (DeltaCreateShareResponse);
    rpc DeltaGetShare(DeltaGetShareRequest)               returns (DeltaGetShareResponse);
    rpc DeltaListShares(DeltaListSharesRequest)           returns (DeltaListSharesResponse);
    rpc DeltaDropShare(DeltaDropShareRequest)             returns (DeltaDropShareResponse);
    rpc DeltaAddTable(DeltaAddTableRequest)               returns (DeltaAddTableResponse);
    rpc DeltaRemoveTable(DeltaRemoveTableRequest)         returns (DeltaRemoveTableResponse);
    rpc DeltaListTables(DeltaListTablesRequest)           returns (DeltaListTablesResponse);
    rpc DeltaCreateRecipient(DeltaCreateRecipientRequest) returns (DeltaCreateRecipientResponse);
    rpc DeltaGetRecipientByToken(DeltaGetRecipientByTokenRequest) returns (DeltaGetRecipientByTokenResponse);
    rpc DeltaListRecipients(DeltaListRecipientsRequest)   returns (DeltaListRecipientsResponse);
    rpc DeltaDropRecipient(DeltaDropRecipientRequest)     returns (DeltaDropRecipientResponse);

    // Cluster configuration (OIDC, storage settings, etc.)
    rpc GetConfig(GetConfigRequest) returns (GetConfigResponse);
    rpc SetConfig(SetConfigRequest) returns (SetConfigResponse);
    rpc DeleteConfig(DeleteConfigRequest) returns (DeleteConfigResponse);
    rpc ListConfig(ListConfigRequest) returns (ListConfigResponse);

    // Server Pools
    rpc CreatePool(CreatePoolRequest) returns (CreatePoolResponse);
    rpc GetPool(GetPoolRequest) returns (GetPoolResponse);
    rpc ListPools(ListPoolsRequest) returns (ListPoolsResponse);
    rpc UpdatePool(UpdatePoolRequest) returns (UpdatePoolResponse);
    rpc DeletePool(DeletePoolRequest) returns (DeletePoolResponse);

    // Placement groups — explicit PG → OSD mapping. Mutated by the
    // balancer service; consumed by Gateway read/write paths.
    rpc GetPlacementGroup(GetPlacementGroupRequest) returns (GetPlacementGroupResponse);
    rpc ListPlacementGroups(ListPlacementGroupsRequest) returns (ListPlacementGroupsResponse);

    // Tenants (multi-tenancy)
    rpc CreateTenant(CreateTenantRequest) returns (CreateTenantResponse);
    rpc GetTenant(GetTenantRequest) returns (GetTenantResponse);
    rpc ListTenants(ListTenantsRequest) returns (ListTenantsResponse);
    rpc UpdateTenant(UpdateTenantRequest) returns (UpdateTenantResponse);
    rpc DeleteTenant(DeleteTenantRequest) returns (DeleteTenantResponse);

    // Bucket versioning
    rpc PutBucketVersioning(PutBucketVersioningRequest) returns (PutBucketVersioningResponse);
    rpc GetBucketVersioning(GetBucketVersioningRequest) returns (GetBucketVersioningResponse);

    // Deduplication policy (objectio-docs architecture/design/dedup.md)
    rpc SetBucketDedup(SetBucketDedupRequest) returns (SetBucketDedupResponse);
    rpc GetDedupPolicy(GetDedupPolicyRequest) returns (GetDedupPolicyResponse);
    // Primary OSD of each chunk fingerprint, for dry-run accounting.
    rpc LocateChunks(LocateChunksRequest) returns (LocateChunksResponse);

    // Stripes referenced by more than one object (a zero-copy CopyObject;
    // later block snapshots and dedup). Unshared stripes have no entry.
    rpc ShareStripes(ShareStripesRequest) returns (ShareStripesResponse);
    rpc ReleaseStripes(ReleaseStripesRequest) returns (ReleaseStripesResponse);
    // Small-object packs (objectio-docs architecture/design/small-object-packing.md).
    rpc IntendPack(IntendPackRequest) returns (IntendPackResponse);
    rpc SealPack(SealPackRequest) returns (SealPackResponse);
    rpc AbortPack(AbortPackRequest) returns (AbortPackResponse);
    rpc GetPack(GetPackRequest) returns (GetPackResponse);
    rpc ListPacks(ListPacksRequest) returns (ListPacksResponse);
    rpc PackMoveShard(PackMoveShardRequest) returns (PackMoveShardResponse);
    rpc PackSettle(PackSettleRequest) returns (PackSettleResponse);

    // Block storage metadata, replicated through Raft: volumes, each
    // volume's chunk map, snapshots, clones. The block gateway keeps none
    // of its own. Chunks shared with snapshots and clones are counted in
    // the shared-stripe registry, so each frees only what it alone used.
    rpc BlockCreateVolume(BlockCreateVolumeRequest) returns (BlockVolumeResponse);
    rpc BlockGetVolume(BlockGetVolumeRequest) returns (BlockVolumeResponse);
    rpc BlockListVolumes(BlockListVolumesRequest) returns (BlockListVolumesResponse);
    rpc BlockUpdateVolume(BlockUpdateVolumeRequest) returns (BlockVolumeResponse);
    rpc BlockDeleteVolume(BlockDeleteVolumeRequest) returns (BlockReleaseResponse);
    rpc BlockGetChunks(BlockGetChunksRequest) returns (BlockGetChunksResponse);
    rpc BlockCommitChunks(BlockCommitChunksRequest) returns (BlockReleaseResponse);
    rpc BlockCreateSnapshot(BlockCreateSnapshotRequest) returns (BlockSnapshotResponse);
    rpc BlockGetSnapshot(BlockGetSnapshotRequest) returns (BlockSnapshotResponse);
    rpc BlockListSnapshots(BlockListSnapshotsRequest) returns (BlockListSnapshotsResponse);
    rpc BlockDeleteSnapshot(BlockDeleteSnapshotRequest) returns (BlockReleaseResponse);
    rpc BlockCloneVolume(BlockCloneVolumeRequest) returns (BlockVolumeResponse);

    // Object lock configuration
    rpc PutObjectLockConfiguration(PutObjectLockConfigRequest) returns (PutObjectLockConfigResponse);
    rpc GetObjectLockConfiguration(GetObjectLockConfigRequest) returns (GetObjectLockConfigResponse);

    // Lifecycle configuration
    rpc PutBucketLifecycle(PutBucketLifecycleRequest) returns (PutBucketLifecycleResponse);
    rpc GetBucketLifecycle(GetBucketLifecycleRequest) returns (GetBucketLifecycleResponse);
    rpc DeleteBucketLifecycle(DeleteBucketLifecycleRequest) returns (DeleteBucketLifecycleResponse);

    // Bucket default server-side encryption configuration
    rpc PutBucketEncryption(PutBucketEncryptionRequest) returns (PutBucketEncryptionResponse);
    rpc GetBucketEncryption(GetBucketEncryptionRequest) returns (GetBucketEncryptionResponse);
    rpc DeleteBucketEncryption(DeleteBucketEncryptionRequest) returns (DeleteBucketEncryptionResponse);

    // Small per-bucket settings (public access block, CORS, ...), each a
    // named opaque value. Removed with the bucket.
    rpc GetBucketSetting(GetBucketSettingRequest) returns (GetBucketSettingResponse);
    // A named lease held by one caller at a time, for cluster-wide
    // background work only one gateway should do (the lifecycle scan).
    rpc AcquireLease(AcquireLeaseRequest) returns (AcquireLeaseResponse);
    // Rolling upgrades (objectio-docs core/upgrade-path.md): every node
    // reports its release and format level; the operator finalizes once all
    // run the new release, raising the level the cluster may write.
    rpc ReportVersion(ReportVersionRequest) returns (ReportVersionResponse);
    rpc GetUpgradeStatus(GetUpgradeStatusRequest) returns (GetUpgradeStatusResponse);
    rpc FinalizeUpgrade(FinalizeUpgradeRequest) returns (FinalizeUpgradeResponse);
    rpc PutBucketSetting(PutBucketSettingRequest) returns (PutBucketSettingResponse);

    // KMS key management (for SSE-KMS). Key material is wrapped by the
    // service master key before it reaches meta, so meta never sees
    // plaintext KEKs — they're encrypted-at-rest in Redb.
    rpc CreateKmsKey(CreateKmsKeyRequest) returns (CreateKmsKeyResponse);
    rpc GetKmsKey(GetKmsKeyRequest) returns (GetKmsKeyResponse);
    rpc ListKmsKeys(ListKmsKeysRequest) returns (ListKmsKeysResponse);
    rpc DeleteKmsKey(DeleteKmsKeyRequest) returns (DeleteKmsKeyResponse);

    // Named IAM policies (PBAC)
    rpc CreatePolicy(CreatePolicyRequest) returns (CreatePolicyResponse);
    rpc GetPolicy(GetPolicyRequest) returns (GetPolicyResponse);
    rpc ListPolicies(ListPoliciesRequest) returns (ListPoliciesResponse);
    rpc DeletePolicy(DeletePolicyRequest) returns (DeletePolicyResponse);
    rpc AttachPolicy(AttachPolicyRequest) returns (AttachPolicyResponse);
    rpc DetachPolicy(DetachPolicyRequest) returns (DetachPolicyResponse);
    rpc ListAttachedPolicies(ListAttachedPoliciesRequest) returns (ListAttachedPoliciesResponse);
    // Replace a named policy's document (it stays attached where it is).
    rpc UpdatePolicy(UpdatePolicyRequest) returns (UpdatePolicyResponse);
    // Suspend or reactivate a user, or change its display name or email.
    rpc UpdateUser(UpdateUserRequest) returns (UpdateUserResponse);
    // Deactivate or reactivate an access key.
    rpc UpdateAccessKey(UpdateAccessKeyRequest) returns (UpdateAccessKeyResponse);
    // The cluster's STS signing key: random, created on first use, shared
    // by every gateway so each accepts the others' temporary credentials.
    // Internal (gateway to meta); never exposed through an admin API.
    rpc GetStsSigningKey(GetStsSigningKeyRequest) returns (GetStsSigningKeyResponse);
    // Roles: identities that are assumed (STS), with a trust policy saying
    // who may assume them, and named policies attached saying what they
    // may do.
    rpc CreateRole(CreateRoleRequest) returns (CreateRoleResponse);
    rpc GetRole(GetRoleRequest) returns (GetRoleResponse);
    rpc ListRoles(ListRolesRequest) returns (ListRolesResponse);
    rpc UpdateRole(UpdateRoleRequest) returns (UpdateRoleResponse);
    rpc DeleteRole(DeleteRoleRequest) returns (DeleteRoleResponse);
    // Rename a group or change its path.
    rpc UpdateGroup(UpdateGroupRequest) returns (UpdateGroupResponse);
    // Inline policies of users, groups and roles. Put replaces one of the
    // same name; Delete of one that isn't there is NOT_FOUND.
    rpc PutInlinePolicy(PutInlinePolicyRequest) returns (PutInlinePolicyResponse);
    rpc GetInlinePolicy(GetInlinePolicyRequest) returns (GetInlinePolicyResponse);
    rpc ListInlinePolicies(ListInlinePoliciesRequest) returns (ListInlinePoliciesResponse);
    rpc DeleteInlinePolicy(DeleteInlinePolicyRequest) returns (DeleteInlinePolicyResponse);

    // Keys whose ObjectMeta copies may disagree: a write or delete that
    // reached the quorum but not every copy. Gateways heal them
    // (objectio-docs core/object-metadata-quorum.md, healing).
    rpc HealEnqueue(HealEnqueueRequest) returns (HealEnqueueResponse);
    rpc HealList(HealListRequest) returns (HealListResponse);
    rpc HealClaim(HealClaimRequest) returns (HealClaimResponse);
    rpc HealDone(HealDoneRequest) returns (HealDoneResponse);

    // This node's Prometheus exposition, so the gateway can serve it from
    // its own /metrics instead of every meta node needing a scrape target.
    rpc GetMetrics(GetMetricsRequest) returns (GetMetricsResponse);

    // This node's wall clock, answered locally. Gateways compare theirs
    // with it and refuse stamped writes while they differ by more than
    // 500 ms (core/object-metadata-quorum.md, "Stamps").
    rpc GetTime(GetTimeRequest) returns (GetTimeResponse);
}

message GetTimeRequest {}
message GetTimeResponse {
    uint64 unix_millis = 1;
}

// Shared by MetadataService.GetMetrics and StorageService.GetMetrics.
message GetMetricsRequest {}
message GetMetricsResponse {
    string text = 1;    // Prometheus text exposition format 0.0.4
    // objectio_common::process_metrics::instance_id() of the responding
    // process. The gateway drops `process_*` from a response that came
    // from its own process (the all-in-one binary) instead of repeating it.
    string process_instance = 2;
}

// Bucket metadata
message BucketMeta {
    string name = 1;
    string owner = 2;
    uint64 created_at = 3;
    string storage_class = 4;
    VersioningState versioning = 5;
    string pool = 6;                 // Server pool for placement (empty = default pool)
    string tenant = 7;               // Owning tenant (empty = system tenant)
    uint64 quota_bytes = 8;          // Per-bucket storage quota (0 = unlimited)
    uint64 quota_objects = 9;        // Per-bucket object count quota (0 = unlimited)
    ObjectLockConfiguration object_lock = 10;  // Object lock config (immutable after creation)
    DedupPolicy dedup = 11;          // Unset fields inherit from the tenant, then the cluster
    // NOTE: default encryption is persisted in a separate table keyed by bucket name
    // (BUCKET_ENCRYPTION_CONFIGS) to keep BucketMeta read-hot and avoid rewriting it on
    // PutBucketEncryption. Loaded into the meta service on boot. No field here.
}

enum VersioningState {
    VERSIONING_DISABLED = 0;
    VERSIONING_ENABLED = 1;
    VERSIONING_SUSPENDED = 2;
}

// Erasure coding type
enum ErasureType {
    // Standard Reed-Solomon MDS (Maximum Distance Separable)
    // Any k shards can reconstruct the data
    ERASURE_MDS = 0;

    // Locally Repairable Codes (LRC)
    // Local parity groups enable faster single-shard recovery
    ERASURE_LRC = 1;

    // Simple replication (no erasure coding)
    // Data is replicated N times without encoding
    // Use replication_count=1 for single-disk mode (no redundancy)
    // Use replication_count=3 for 3-way replication
    ERASURE_REPLICATION = 2;
}

// Object metadata
message ObjectMeta {
    string bucket = 1;
    string key = 2;
    bytes object_id = 3;        // 16-byte UUID
    uint64 size = 4;
    string etag = 5;
    string content_type = 6;
    uint64 created_at = 7;
    uint64 modified_at = 8;
    string storage_class = 9;
    map<string, string> user_metadata = 10;
    string version_id = 11;
    bool is_delete_marker = 12;
    repeated StripeMeta stripes = 13;
    ObjectRetention retention = 14;   // Object-level retention policy
    LegalHold legal_hold = 15;        // Legal hold status

    // Server-side encryption (all optional; absent = plaintext, backward compatible).
    // Populated on PutObject; consulted on GetObject to decrypt the reconstructed stream.
    SseAlgorithm encryption_algorithm = 16;
    string kms_key_id = 17;                        // KMS key ARN (SSE_KMS only)
    bytes encrypted_dek = 18;                      // DEK wrapped by master/KMS key
    bytes encryption_iv = 19;                      // Base IV; per-chunk IVs derived deterministically
    map<string, string> encryption_context = 20;   // AWS KMS encryption context

    // Node that counts this object in usage accounting. ObjectMeta is
    // written to every OSD in the key's placement; exactly one of them —
    // this one — reports it, so per-OSD usage sums without double
    // counting. Set by the gateway on write. Empty on objects written
    // before it existed; OSDs then fall back to the holder of shard 0 of
    // stripe 0, which is the same node for single-part PUTs.
    bytes usage_owner = 21;

    // The object's bytes, for a small object stored in this record instead
    // of in shards: `stripes` is then empty. As stored — ciphertext when the
    // object is encrypted. Written whole to every OSD in the key's
    // placement, so any one of them can serve it. Empty for every other
    // object, and in listings, which never carry it.
    bytes inline_data = 22;

    // The flexible checksum (x-amz-checksum-*) the client sent with the PUT,
    // checked against the body before anything was stored. Returned on
    // GET/HEAD with `x-amz-checksum-mode: ENABLED`. Absent when the PUT
    // carried none, and on objects written before it existed.
    ObjectChecksum checksum = 23;

    // Object tags (S3 object tagging): at most 10, set by PutObjectTagging,
    // `x-amz-tagging` on PUT / CreateMultipartUpload, or copied by CopyObject.
    map<string, string> tags = 24;

    // A multipart object's parts' checksums, in order (GetObjectAttributes
    // lists them); `checksum` is then their composite.
    repeated ObjectChecksum part_checksums = 25;

    // Bucket replication (architecture/design/bucket-replication.md):
    // each target this version is to reach, and how far it got — "PENDING",
    // "COMPLETED" or "FAILED". Written with the version itself, so a
    // version is never committed without its mark.
    map<string, string> replication = 26;
    // This version is a replica another cluster sent: never replicated
    // again (two-way rules can't loop). The source cluster, for audit.
    string replica_of = 27;

    // The format level a reader needs to read this version correctly
    // (objectio-docs core/upgrade-path.md): set by a writer that uses a
    // feature a lower level would misread. A reader below it refuses the
    // object instead of serving wrong bytes. 0: nothing beyond the base.
    uint32 required_level = 28;
    // Order of writes to this object's metadata copies: a hybrid logical
    // clock value (objectio_common::stamp). An OSD keeps the highest; a
    // read takes the newest of a read quorum. 0 = unstamped.
    uint64 stamp = 29;
    // Order of updates of this same object (tagging, retention, legal
    // hold, packing, a shard moved or rebuilt), which keep `stamp`: compared
    // only between copies of one object (same stamp and object id), so an
    // update never outranks a newer object. 0 = never updated.
    uint64 update_stamp = 30;
}

// A full-object checksum, as S3 reports it.
message ObjectChecksum {
    string algorithm = 1;   // S3 name: CRC32, CRC32C, CRC64NVME, SHA1, SHA256
    string value = 2;       // base64 of the big-endian checksum / digest
}

// Stripe metadata (EC group)
message StripeMeta {
    uint64 stripe_id = 1;
    uint32 ec_k = 2;                // Data shards
    uint32 ec_m = 3;                // Total parity shards (local + global for LRC)
    repeated ShardLocation shards = 4;

    // LRC-specific fields
    ErasureType ec_type = 5;        // MDS or LRC
    uint32 ec_local_parity = 6;     // Number of local parity shards (LRC only)
    uint32 ec_global_parity = 7;    // Number of global parity shards (LRC only)
    uint32 local_group_size = 8;    // Data shards per local group (LRC only)

    // Original data size for this stripe (needed for decoding multipart uploads)
    uint64 data_size = 9;

    // Object ID used when writing shards (needed for multipart uploads where each part has different ID)
    bytes object_id = 10;

    // AES-CTR initialization vector used to encrypt this stripe's bytes,
    // when the object is SSE-S3/SSE-KMS. Multipart objects set it per
    // stripe; a single-part object leaves it empty and uses
    // `ObjectMeta.encryption_iv` for its whole body.
    bytes encryption_iv = 11;

    // This object's bytes are [slice_offset, slice_offset + slice_length)
    // of the stripe's data: the stripe is a pack shared by several small
    // objects (see objectio-docs architecture/design/small-object-packing.md).
    // slice_length 0: the whole stripe is this object's.
    uint64 slice_offset = 14;
    uint64 slice_length = 15;
    // Set for a packed object: its stripe is the pack recorded under this id
    // in meta (GetPack), which holds the shard locations; `shards` is empty
    // here and `object_id` is the pack id.
    bytes pack_id = 16;
    // Each shard is kept in its OSD's metadata record, not a disk block, and
    // was sent with the object's metadata (B21, format level 5).
    bool shards_in_metadata = 17;
}

// A pack: one erasure-coded stripe holding many small objects' bytes,
// recorded once so repair and drain update one record. Its referrers are
// the objects in it, in the shared-stripe registry under `pack_id`.
message PackRecord {
    bytes pack_id = 1;
    StripeMeta stripe = 2;      // ec scheme, shard locations, data size
    uint64 data_len = 3;
    uint64 version = 4;         // bumped on every location change
    uint64 created_at = 5;
    bool sealed = 6;            // false from IntendPack until SealPack
    // The bucket whose objects it holds: its shards are placed in that
    // bucket's pool, under the key `.objectio-pack/<hex pack id>`.
    string bucket = 7;
    // The objects packed into it, as the packer read them: how
    // reconciliation finds the ObjectMeta behind each referrer.
    repeated PackMember members = 8;
}

message PackMember {
    bytes object_id = 1;
    string key = 2;
    string version_id = 3;      // empty: an unversioned object
    uint64 slice_offset = 4;
    uint64 slice_length = 5;
    // The stripe it had before: released once every copy names the pack.
    // Cleared when the member is settled.
    StripeMeta old_stripe = 6;
    // Its switch is done or abandoned: reconciliation leaves it alone. Kept
    // in the record (key and slice) so compaction knows what's live.
    bool settled = 7;
}

// Settle members of a pack: their switch is finished or abandoned, so
// reconciliation needn't look at them again. They stay in the record,
// marked settled, without their old stripe. Members not in the record
// are ignored.
message PackSettleRequest {
    bytes pack_id = 1;
    repeated bytes object_ids = 2;
}
message PackSettleResponse {}

// Shard location
message ShardLocation {
    uint32 position = 1;        // Position in stripe
    bytes node_id = 2;          // 16-byte UUID
    bytes disk_id = 3;          // 16-byte UUID
    uint64 offset = 4;

    // LRC-specific fields
    ShardType shard_type = 5;   // Type of shard (data, local parity, global parity)
    uint32 local_group = 6;     // Local group index (for LRC)
    // The shard's crc32c as its writer encoded it (B23), kept with the
    // object rather than only by the OSD that holds it: reads and repair
    // check against it, so a shard stored wrong (with an OSD-side checksum
    // of its own wrong bytes) is caught.
    optional uint32 crc32c = 7;
}

// Shard type for LRC
enum ShardType {
    SHARD_DATA = 0;             // Data shard
    SHARD_LOCAL_PARITY = 1;     // Local parity shard (XOR of local group)
    SHARD_GLOBAL_PARITY = 2;    // Global parity shard (RS over all data)
}

// Create bucket
message CreateBucketRequest {
    string name = 1;
    string owner = 2;
    string storage_class = 3;
    string region = 4;
    string tenant = 5;              // Owning tenant (empty = system tenant)
    // Settings the bucket starts with (see GetBucketSetting), written in the
    // same commit as the bucket: it never exists without them.
    map<string, bytes> settings = 6;
    // The pool its data goes to. Empty: the tenant's default pool, else the
    // cluster's default placement. Fixed for the bucket's life.
    string pool = 7;
}

message SetBucketOwnerRequest {
    string bucket = 1;
    string owner = 2;               // user_id of the new owner
}

message SetBucketOwnerResponse {
    bool success = 1;
}

message SetBucketQuotaRequest {
    string bucket = 1;
    uint64 quota_bytes = 2;      // 0 = unlimited
    uint64 quota_objects = 3;    // 0 = unlimited
}

message SetBucketQuotaResponse {}

message CreateBucketResponse {
    BucketMeta bucket = 1;
}

// Delete bucket
message DeleteBucketRequest {
    string name = 1;
}

message DeleteBucketResponse {
    bool success = 1;
}

// Get bucket
message GetBucketRequest {
    string name = 1;
}

message GetBucketResponse {
    BucketMeta bucket = 1;
}

// List buckets
message ListBucketsRequest {
    string owner = 1;
    string tenant = 2;              // Filter by tenant (empty = all for system admin)
}

message ListBucketsResponse {
    repeated BucketMeta buckets = 1;
}

// Create object
message CreateObjectRequest {
    string bucket = 1;
    string key = 2;
    uint64 size = 3;
    string content_type = 4;
    string etag = 5;
    map<string, string> user_metadata = 6;
    repeated StripeMeta stripes = 7;
    bytes object_id = 8;        // 16-byte UUID (provided by caller)
    // Placement context the gateway picked up from GetPlacementResponse.
    // Server trusts these for the listing entry so reads don't need a
    // second hash+pool lookup. 0 / "" = placed without a placement group
    // (per-object CRUSH); the listing entry has no PG then.
    uint32 pg_id = 9;
    string pool = 10;
    // The OSDs the gateway wrote the object's ObjectMeta to, by position
    // (its GetPlacement nodes). Meta records them as the key's home, and
    // GetPlacement returns the home for the key from then on, so the
    // metadata is found where it was written whatever joins or leaves the
    // cluster. Empty leaves the home as it is.
    repeated bytes home_osd_ids = 11;
    // A conditional PUT (If-Match / If-None-Match): the listing entry, the
    // key's current object as Raft knows it, must be in this state when
    // this write commits, or it is refused (FAILED_PRECONDITION with the
    // message "PreconditionFailed", or "NoSuchKey" for If-Match on a key
    // with no object). "*" or an ETag; empty = no condition.
    string if_match = 12;
    string if_none_match = 13;
}

// Where a key's ObjectMeta lives: the OSDs it was written to, by position.
// Kept while the key may have versions on them, past its listing entry.
message ObjectHome {
    repeated bytes osd_ids = 1;
}

message CreateObjectResponse {
    ObjectMeta object = 1;
}

// Delete object
message DeleteObjectRequest {
    string bucket = 1;
    string key = 2;
    string version_id = 3;      // Optional: delete specific version
    // The key is gone for good (an unversioned bucket's DELETE): forget its
    // home too. Never for a rollback, which may leave an older object there.
    bool forget_home = 4;
}

message DeleteObjectResponse {
    bool success = 1;
    string version_id = 2;      // Version ID of delete marker (if versioning enabled)
}

// Get object
message GetObjectRequest {
    string bucket = 1;
    string key = 2;
    string version_id = 3;      // Optional: get specific version
}

message GetObjectResponse {
    ObjectMeta object = 1;
}

// Lightweight per-object summary stored in the Meta-backed
// OBJECT_LISTINGS index. Carries the fields a client needs for
// ListObjects responses (key, size, etag, timestamps) plus enough
// routing info (primary_osd_id) for the gateway to locate the full
// ObjectMeta without a scatter-gather. This is the authoritative
// source of truth for "does object (bucket,key) exist in this
// cluster" — updates happen through Raft MultiCas so every meta
// replica sees the same commit at the same log position.
message ObjectListingEntry {
    string bucket = 1;
    string key = 2;
    uint64 size = 3;
    string etag = 4;
    string content_type = 5;
    uint64 created_at = 6;
    uint64 modified_at = 7;
    string version_id = 8;
    bool is_delete_marker = 9;
    string storage_class = 10;
    map<string, string> user_metadata = 11;
    // Any one OSD that should have the full ObjectMeta replica. With
    // the fan-out ObjectMeta model (every shard host holds a copy),
    // this is a hint — the gateway tries this one first, falls back to
    // the CRUSH placement on miss.
    bytes primary_osd_id = 12;

    // Placement-group ID the object was routed through. 0 = placed
    // without a placement group (per-object CRUSH). With a non-zero
    // pg_id the gateway can look up the PG's current osd_ids in one
    // in-memory cache hit instead of recomputing CRUSH.
    uint32 pg_id = 13;
    // The pool name the PG lives in. Empty = default pool.
    string pool = 14;
}

// List objects
message ListObjectsRequest {
    string bucket = 1;
    string prefix = 2;
    string delimiter = 3;
    string start_after = 4;
    string continuation_token = 5;
    uint32 max_keys = 6;
    bool include_versions = 7;
}

message ListObjectsResponse {
    reserved 1;  // was `objects`, full ObjectMeta entries; `entries` replaced it
    repeated string common_prefixes = 2;
    string next_continuation_token = 3;
    bool is_truncated = 4;
    uint32 key_count = 5;
    // The listing, from meta's index.
    repeated ObjectListingEntry entries = 6;
}

// Get placement for new object
message GetPlacementRequest {
    string bucket = 1;
    string key = 2;
    uint64 size = 3;
    string storage_class = 4;
}

message GetPlacementResponse {
    string storage_class = 1;
    uint32 ec_k = 2;
    uint32 ec_m = 3;                // Total parity (local + global for LRC)
    repeated NodePlacement nodes = 4;

    // LRC-specific fields
    ErasureType ec_type = 5;        // MDS, LRC, or REPLICATION
    uint32 ec_local_parity = 6;     // Number of local parity shards (LRC only)
    uint32 ec_global_parity = 7;    // Number of global parity shards (LRC only)
    uint32 local_group_size = 8;    // Data shards per local group (LRC only)

    // Replication-specific fields
    uint32 replication_count = 9;   // Number of replicas (REPLICATION mode only)

    // Placement group this object was routed through. The gateway
    // stamps it into ObjectListingEntry.pg_id so LIST and GET can
    // short-circuit the jump-hash + PG lookup on the next request.
    // pg_version is the CAS version at placement time — lets the
    // gateway detect a mid-flight PG migration and retry from
    // GetPlacement rather than writing against a stale tuple.
    uint32 pg_id = 11;
    uint64 pg_version = 12;
    string pool = 13;               // Pool this PG lives in.

    // Effective dedup policy for this bucket — bucket, then tenant, then
    // cluster default — resolved here so a PUT needs no extra round trip.
    // The gateway needs only the mode and the fingerprint domain, never
    // the scope.
    DedupMode dedup_mode = 14;
    string dedup_domain = 15;
}

message NodePlacement {
    uint32 position = 1;            // Shard position
    bytes node_id = 2;
    string node_address = 3;
    bytes disk_id = 4;

    // LRC-specific fields
    ShardType shard_type = 5;       // Type of shard
    uint32 local_group = 6;         // Local group index (for LRC)
    string te_segment = 7;          // OSD's Transfer Engine segment; empty if none
}

// Multipart upload
message CreateMultipartUploadRequest {
    string bucket = 1;
    string key = 2;
    string content_type = 3;
    map<string, string> user_metadata = 4;

    // SSE decision made on the CreateMultipartUpload request (AWS semantics:
    // multipart SSE is fixed at creation time; per-UploadPart SSE headers
    // are ignored). The gateway generates + wraps the DEK here so parts
    // can decrypt it without round-tripping through a KMS again.
    SseAlgorithm encryption_algorithm = 5;
    string kms_key_id = 6;
    bytes encrypted_dek = 7;
    // SSE-C only: the base64-encoded MD5 of the customer-supplied key.
    // UploadPart requests for this MPU must resupply the key and a matching
    // MD5 — we never store the key itself.
    string customer_key_md5 = 8;
    // SSE-KMS only: AWS-compatible encryption context (arbitrary string map).
    // Supplied at CreateMultipartUpload time as an AEAD binding on the wrapped
    // DEK — decrypt fails if the context differs.
    map<string, string> encryption_context = 9;
}

message CreateMultipartUploadResponse {
    string upload_id = 1;
    string bucket = 2;
    string key = 3;

    // Echo back the SSE decision so the gateway response to the client
    // can include the right `x-amz-server-side-encryption` header.
    SseAlgorithm encryption_algorithm = 4;
    string kms_key_id = 5;
}

// Look up an in-flight MPU so the gateway can fetch its encryption
// state when an UploadPart request arrives (AWS semantics fix SSE at
// CreateMultipartUpload time; per-part SSE headers are ignored).
message GetMultipartUploadRequest {
    string bucket = 1;
    string key = 2;
    string upload_id = 3;
}

message GetMultipartUploadResponse {
    bool found = 1;
    string content_type = 2;
    map<string, string> user_metadata = 3;
    uint64 initiated = 4;
    SseAlgorithm encryption_algorithm = 5;
    string kms_key_id = 6;
    bytes encrypted_dek = 7;
    string customer_key_md5 = 8;
    map<string, string> encryption_context = 9;
}

message CompleteMultipartUploadRequest {
    string bucket = 1;
    string key = 2;
    string upload_id = 3;
    repeated PartInfo parts = 4;
}

message PartInfo {
    uint32 part_number = 1;
    string etag = 2;
    uint64 size = 3;
}

message CompleteMultipartUploadResponse {
    ObjectMeta object = 1;
    // Stripes of parts that were uploaded but left out of the object. The
    // upload is gone, so nothing refers to them; the caller frees them.
    repeated StripeMeta unused_stripes = 2;
}

message AbortMultipartUploadRequest {
    string bucket = 1;
    string key = 2;
    string upload_id = 3;
}

message AbortMultipartUploadResponse {
    bool success = 1;
    // Stripes of every part the aborted upload held, taken out of the upload
    // in the same step that dropped it, so the caller can free them without
    // racing a CompleteMultipartUpload.
    repeated StripeMeta stripes = 2;
}

message ListMultipartUploadsRequest {
    string bucket = 1;
    string prefix = 2;
    string key_marker = 3;
    string upload_id_marker = 4;
    uint32 max_uploads = 5;
}

message ListMultipartUploadsResponse {
    repeated MultipartUpload uploads = 1;
    string next_key_marker = 2;
    string next_upload_id_marker = 3;
    bool is_truncated = 4;
}

message MultipartUpload {
    string key = 1;
    string upload_id = 2;
    uint64 initiated = 3;
    string storage_class = 4;
}

// Register a completed part upload
message RegisterPartRequest {
    string bucket = 1;
    string key = 2;
    string upload_id = 3;
    uint32 part_number = 4;
    string etag = 5;
    uint64 size = 6;
    repeated StripeMeta stripes = 7;  // EC stripes info for this part (multiple for large parts)
    // The part's flexible checksum (x-amz-checksum-*), checked against its
    // body; the object's composite checksum is made of these.
    ObjectChecksum checksum = 8;
}

message RegisterPartResponse {
    bool success = 1;
    string etag = 2;            // Confirmed ETag
    // Stripes of the part this one replaced (same part number uploaded
    // again). Nothing refers to them any more; the caller frees them.
    repeated StripeMeta replaced_stripes = 3;
}

// List parts of a multipart upload
message ListPartsRequest {
    string bucket = 1;
    string key = 2;
    string upload_id = 3;
    uint32 part_number_marker = 4;  // Start listing after this part number
    uint32 max_parts = 5;           // Max parts to return (default 1000)
}

message ListPartsResponse {
    repeated PartMeta parts = 1;
    bool is_truncated = 2;
    uint32 next_part_number_marker = 3;
    string bucket = 4;
    string key = 5;
    string upload_id = 6;
}

// Extended part metadata (includes stripe info for internal use)
message PartMeta {
    uint32 part_number = 1;
    string etag = 2;
    uint64 size = 3;
    uint64 last_modified = 4;
    repeated StripeMeta stripes = 5;  // EC stripes info (multiple for large parts)
    ObjectChecksum checksum = 6;
}

// Bucket policy operations
message SetBucketPolicyRequest {
    string bucket = 1;
    string policy_json = 2;  // JSON-encoded bucket policy
}

message SetBucketPolicyResponse {
    bool success = 1;
}

message GetBucketPolicyRequest {
    string bucket = 1;
}

message GetBucketPolicyResponse {
    string policy_json = 1;  // JSON-encoded bucket policy (empty if no policy)
    bool has_policy = 2;     // True if bucket has a policy set
}

message DeleteBucketPolicyRequest {
    string bucket = 1;
}

message DeleteBucketPolicyResponse {
    bool success = 1;
}

// Failure domain for CRUSH placement. Empty string at any level means
// "inherit from enclosing level"; default-zero keeps OSDs that only
// populate region/datacenter/rack backward-compatible with this richer
// model. `zone` sits between region and datacenter (AZ / row); `host`
// sits below rack (physical host) so multiple OSDs on the same box can
// share a failure-correlation group.
message FailureDomainInfo {
    string region = 1;          // Region name (e.g., "us-east-1")
    string datacenter = 2;      // Datacenter name (e.g., "dc1"); in cloud: empty and rely on zone
    string rack = 3;            // Rack identifier (e.g., "rack-01")
    string zone = 4;            // Availability zone (e.g., "us-east-1a") or row (on-prem)
    string host = 5;            // Physical host (e.g., "node-07")
}

// OSD registration
message RegisterOsdRequest {
    bytes node_id = 1;                  // 16-byte UUID
    string address = 2;                 // gRPC endpoint (e.g., "http://192.168.1.10:9002")
    repeated bytes disk_ids = 3;        // 16-byte UUIDs for each disk
    FailureDomainInfo failure_domain = 4; // Where this OSD sits in the topology
    string node_name = 5;               // Human-readable name (optional)
    double weight = 6;                  // Placement weight (default: 1.0)
    // Raw capacity of each disk in bytes, index-aligned with `disk_ids`.
    // Meta sums these across OSDs for cluster capacity accounting. Older OSDs
    // that don't populate this report 0 for their disks.
    repeated uint64 disk_capacity_bytes = 7;
    // Transfer Engine segment ("ip:port") this OSD accepts shard transfers
    // on. Empty when it has none; gateways then use gRPC bytes.
    string te_segment = 8;
}

message RegisterOsdResponse {
    bool success = 1;
    uint64 topology_version = 2;        // Current cluster topology version
    // 16-byte UUID identifying this cluster. Meta lazily generates one
    // on first need and persists it in the config store (`cluster/uuid`).
    // OSDs write it into each disk's superblock so a disk cannot be
    // accidentally mounted by a different cluster — matches Ceph's
    // FSID guard. Empty on pre-3.1 meta nodes; OSDs treat that as
    // "leave existing superblock alone".
    bytes cluster_uuid = 3;
}

// Operator-declared state for an OSD. Serialised as a string so adding
// future variants (e.g. "quiescing") doesn't break older clients.
enum OsdAdminState {
    OSD_ADMIN_IN = 0;        // Default — participates in placement.
    OSD_ADMIN_OUT = 1;       // Forced out; no new shards; existing shards stay.
    OSD_ADMIN_DRAINING = 2;  // Migration in progress; excluded from placement.
}

message SetOsdAdminStateRequest {
    bytes node_id = 1;          // 16-byte UUID
    OsdAdminState state = 2;
    string requested_by = 3;    // Audit (user id / "console" / "cli")
}

message SetOsdAdminStateResponse {
    bool found = 1;             // node_id matched a registered OSD
    bool changed = 2;           // state actually changed (false if no-op)
    OsdAdminState effective = 3; // State after apply
}

// Snapshot of drain progress per currently-Draining OSD.
message GetDrainStatusRequest {}

message GetDrainStatusResponse {
    repeated DrainStatus drains = 1;
}

message DrainStatus {
    bytes node_id = 1;              // 16-byte UUID
    uint64 shards_remaining = 2;    // Current shard_count on the OSD
    uint64 initial_shards = 3;      // shard_count when drain started (this leader term)
    uint64 shards_migrated = 4;     // Successfully moved by migrator
    uint64 updated_at = 5;          // Unix seconds of last sweep
    string last_error = 6;          // Empty when last sweep OK
}

message GetRebalanceStatusRequest {}

message GetRebalanceStatusResponse {
    bool started = 1;
    bool paused = 2;
    uint64 last_sweep_at = 3;
    uint64 scanned_this_pass = 4;
    uint64 drifts_seen_this_pass = 5;
    uint64 shards_rebalanced_total = 6;
    string last_error = 7;
    // Balancer (PG engine) counters. Since the greenfield cutover the
    // balancer is the only thing moving placement; the drift fields
    // above are kept for wire compat and now mirror pgs_moved_total.
    uint64 pgs_moved_total = 8;
    uint64 pg_candidates_last_tick = 9;
    uint64 pgs_scanned_last_tick = 10;
}

// Get listing nodes for scatter-gather list operations
message GetListingNodesRequest {
    string bucket = 1;          // Optional: filter by bucket's storage class
    // When true, include OSDs that are not currently Active (Draining,
    // Decommissioning, Out). Default false — scatter-gather callers
    // only want live nodes, admin UI sets this to true to render
    // state-colored topology.
    bool include_all_states = 2;
}

message GetListingNodesResponse {
    repeated ListingNode nodes = 1;
    uint64 topology_version = 2; // For continuation token validation
}

message ListingNode {
    bytes node_id = 1;
    string address = 2;
    uint32 shard_id = 3;        // Logical shard ID for partitioned listing (0..N-1)
    // Full failure-domain coordinates so gateways can render the topology
    // tree and prefer same-domain shards on reads (Phase 2). Empty fields
    // on older meta servers fall back to "default".
    FailureDomainInfo failure_domain = 4;
    // Operator-declared state. Defaults to OSD_ADMIN_IN on meta servers
    // that predate this field, which is the same as "no admin override".
    OsdAdminState admin_state = 5;
    // Transfer Engine segment ("ip:port"); empty when the OSD has none.
    string te_segment = 6;
}

// ============ IAM Messages ============

// User status
enum UserStatus {
    USER_ACTIVE = 0;
    USER_SUSPENDED = 1;
    USER_DELETED = 2;
}

// Access key status
enum KeyStatus {
    KEY_ACTIVE = 0;
    KEY_INACTIVE = 1;
}

// What a scoped access key may do. READ_WRITE is deliberately the zero value
// so that an unset field — a key issued before scoping existed, or a client
// that does not set it — imposes no restriction.
enum KeyOperation {
    KEY_OP_READ_WRITE = 0;
    KEY_OP_READ = 1;
}

// User metadata
message UserMeta {
    string user_id = 1;
    string display_name = 2;
    string arn = 3;
    UserStatus status = 4;
    uint64 created_at = 5;
    string email = 6;
    string tenant = 7;              // Owning tenant (empty = system tenant)
    // IAM path, "/" or "/a/b/": in the ARN between "user" and the name.
    // Empty means "/". Written from format level 3.
    string path = 8;
}

// Access key metadata
message AccessKeyMeta {
    string access_key_id = 1;
    string secret_access_key = 2;   // Only returned on creation
    string user_id = 3;
    KeyStatus status = 4;
    uint64 created_at = 5;
    string tenant = 6;              // Inherited from user's tenant
    // Bucket/prefix this key is confined to, as "s3://bucket/prefix/".
    // Empty = unscoped. Narrowing only: it subtracts from the owning user's
    // permissions and can never add to them.
    string scope = 7;
    KeyOperation operation = 8;     // Applies with or without a scope
}

// Create user
message CreateUserRequest {
    string display_name = 1;
    string email = 2;
    string tenant = 3;              // Assign user to tenant (empty = system tenant)
    string path = 4;                // IAM path (empty = "/"); level 3
}

message CreateUserResponse {
    UserMeta user = 1;
}

// Get user
message GetUserRequest {
    string user_id = 1;
}

message GetUserResponse {
    UserMeta user = 1;
}

// List users
message ListUsersRequest {
    uint32 max_results = 1;
    string marker = 2;
}

message ListUsersResponse {
    repeated UserMeta users = 1;
    string next_marker = 2;
    bool is_truncated = 3;
}

// Delete user
message DeleteUserRequest {
    string user_id = 1;
}

message DeleteUserResponse {
    bool success = 1;
}

// Create access key
message CreateAccessKeyRequest {
    string user_id = 1;
    string scope = 2;               // Optional "s3://bucket/prefix/"
    KeyOperation operation = 3;     // Defaults to READ_WRITE
}

message CreateAccessKeyResponse {
    AccessKeyMeta access_key = 1;   // Includes secret_access_key
}

// List access keys
message ListAccessKeysRequest {
    string user_id = 1;
}

message ListAccessKeysResponse {
    repeated AccessKeyMeta access_keys = 1;  // secret_access_key is empty
}

// Delete access key
message DeleteAccessKeyRequest {
    string access_key_id = 1;
}

message DeleteAccessKeyResponse {
    bool success = 1;
}

// Get access key for authentication (includes secret for verification)
message GetAccessKeyRequest {
    string access_key_id = 1;
}

message GetAccessKeyResponse {
    bool found = 1;
    AccessKeyMeta access_key = 2;   // secret_access_key always empty
}

message GetAccessKeyForAuthRequest {
    string access_key_id = 1;
}

message GetAccessKeyForAuthResponse {
    AccessKeyMeta access_key = 1;   // Includes secret_access_key
    UserMeta user = 2;
}

// ============ Iceberg Catalog Messages ============

// Iceberg namespace (multi-level, e.g. ["db1", "schema1"])
message IcebergNamespace {
    repeated string levels = 1;
}

// Iceberg table identifier
message IcebergTableIdentifier {
    repeated string namespace_levels = 1;
    string name = 2;
}

// Iceberg table entry stored in meta
message IcebergTableEntry {
    string metadata_location = 1;   // S3 URL to metadata.json
    uint64 created_at = 2;
    uint64 updated_at = 3;
    bytes metadata_json = 4;        // Full table metadata JSON
    bytes policy_json = 5;          // Optional: IAM-style access policy JSON
}

// ---- Namespace RPCs ----

message IcebergCreateNamespaceRequest {
    repeated string namespace_levels = 1;
    map<string, string> properties = 2;
    string warehouse = 10;
}

message IcebergCreateNamespaceResponse {
    repeated string namespace_levels = 1;
    map<string, string> properties = 2;
}

message IcebergLoadNamespaceRequest {
    repeated string namespace_levels = 1;
    string warehouse = 10;
}

message IcebergLoadNamespaceResponse {
    repeated string namespace_levels = 1;
    map<string, string> properties = 2;
}

message IcebergDropNamespaceRequest {
    repeated string namespace_levels = 1;
    string warehouse = 10;
}

message IcebergDropNamespaceResponse {
    bool success = 1;
}

message IcebergListNamespacesRequest {
    repeated string parent_levels = 1;  // empty = list top-level
    string page_token = 2;
    uint32 page_size = 3;
    string warehouse = 10;
}

message IcebergListNamespacesResponse {
    repeated IcebergNamespace namespaces = 1;
    string next_page_token = 2;
}

message IcebergUpdateNamespacePropertiesRequest {
    repeated string namespace_levels = 1;
    repeated string removals = 2;
    map<string, string> updates = 3;
    string warehouse = 10;
}

message IcebergUpdateNamespacePropertiesResponse {
    repeated string updated = 1;
    repeated string removed = 2;
    repeated string missing = 3;    // keys requested for removal that didn't exist
}

message IcebergNamespaceExistsRequest {
    repeated string namespace_levels = 1;
    string warehouse = 10;
}

message IcebergNamespaceExistsResponse {
    bool exists = 1;
}

// ---- Table RPCs ----

message IcebergCreateTableRequest {
    repeated string namespace_levels = 1;
    string table_name = 2;
    string metadata_location = 3;   // S3 URL to initial metadata.json
    bytes metadata_json = 4;        // Full table metadata JSON
    string warehouse = 10;
}

message IcebergCreateTableResponse {
    string metadata_location = 1;
    bytes metadata_json = 2;        // Stored metadata JSON echoed back
}

message IcebergLoadTableRequest {
    repeated string namespace_levels = 1;
    string table_name = 2;
    string warehouse = 10;
}

message IcebergLoadTableResponse {
    string metadata_location = 1;
    bytes metadata_json = 2;        // Stored metadata JSON
}

message IcebergCommitTableRequest {
    repeated string namespace_levels = 1;
    string table_name = 2;
    string current_metadata_location = 3;   // Expected (CAS)
    string new_metadata_location = 4;       // Desired
    bytes new_metadata_json = 5;            // New metadata JSON to store
    string warehouse = 10;
}

message IcebergCommitTableResponse {
    string metadata_location = 1;
    bytes metadata_json = 2;                // Stored metadata JSON
}

// One table's piece of an atomic multi-table transaction.
message IcebergCommitTableChange {
    repeated string namespace_levels = 1;
    string table_name = 2;
    string current_metadata_location = 3;   // Expected (CAS). Empty = must not exist.
    string new_metadata_location = 4;
    bytes new_metadata_json = 5;
}

// Atomic multi-table commit. Every table-change's expected location must
// match, or the whole transaction aborts with no writes landed. Mapped to
// a single Raft MultiCas by the meta service, so every follower sees the
// commit at the same log position.
message IcebergCommitTransactionRequest {
    string warehouse = 1;
    repeated IcebergCommitTableChange table_changes = 2;
}

message IcebergCommitTransactionResponse {
    // Same length + order as the request's `table_changes`.
    repeated IcebergCommitTableResponse committed = 1;
}

message IcebergDropTableRequest {
    repeated string namespace_levels = 1;
    string table_name = 2;
    bool purge = 3;
    string warehouse = 10;
}

message IcebergDropTableResponse {
    bool success = 1;
}

message IcebergRenameTableRequest {
    IcebergTableIdentifier source = 1;
    IcebergTableIdentifier destination = 2;
}

message IcebergRenameTableResponse {
    bool success = 1;
}

message IcebergListTablesRequest {
    repeated string namespace_levels = 1;
    string page_token = 2;
    uint32 page_size = 3;
    string warehouse = 10;
}

message IcebergListTablesResponse {
    repeated IcebergTableIdentifier identifiers = 1;
    string next_page_token = 2;
}

message IcebergTableExistsRequest {
    repeated string namespace_levels = 1;
    string table_name = 2;
    string warehouse = 10;
}

message IcebergTableExistsResponse {
    bool exists = 1;
}

// ---- Table policy RPCs ----

message IcebergSetTablePolicyRequest {
    repeated string namespace_levels = 1;
    string table_name = 2;
    bytes policy_json = 3;
}

message IcebergSetTablePolicyResponse {
    bool success = 1;
}

message IcebergGetTablePolicyRequest {
    repeated string namespace_levels = 1;
    string table_name = 2;
}

message IcebergGetTablePolicyResponse {
    bytes policy_json = 1;
}

