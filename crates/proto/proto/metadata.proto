// ============================================================
// Server-Side Encryption
// ============================================================

// Encryption algorithm for an object.
// Per-bucket defaults use the same enum (SSE_C cannot be a bucket default).
enum SseAlgorithm {
    SSE_NONE = 0;       // Plaintext (absent field on ObjectMeta defaults here)
    SSE_S3 = 1;         // AES256, server-managed DEK wrapped by service master key
    SSE_KMS = 2;        // aws:kms — DEK wrapped by external KMS
    SSE_C = 3;          // Customer-provided key (per-request only; never a bucket default)
}

// One rule inside BucketSseConfiguration. AWS allows exactly one rule today;
// we model it as repeated for wire compatibility with the AWS XML schema.
message SseRule {
    SseAlgorithm algorithm = 1;
    string kms_key_id = 2;          // KMS key ARN (SSE_KMS only)
    bool bucket_key_enabled = 3;    // S3 Bucket Keys optimization (SSE_KMS only)
}

// Default server-side encryption for a bucket.
// Applied when a PutObject request does not specify its own SSE headers.
message BucketSseConfiguration {
    repeated SseRule rules = 1;
}

message PutBucketEncryptionRequest {
    string bucket = 1;
    BucketSseConfiguration config = 2;
}
message PutBucketEncryptionResponse { bool success = 1; }

message GetBucketEncryptionRequest { string bucket = 1; }
message GetBucketEncryptionResponse {
    BucketSseConfiguration config = 1;
    bool found = 2;
}

message DeleteBucketEncryptionRequest { string bucket = 1; }
message DeleteBucketEncryptionResponse { bool success = 1; }

message AcquireLeaseRequest {
    string name = 1;
    string holder = 2;       // the caller's unique id
    uint64 ttl_secs = 3;
    bool release = 4;        // give it up (if held by `holder`)
}
message AcquireLeaseResponse {
    bool acquired = 1;
    string holder = 2;       // who holds it now
    uint64 expires_at = 3;   // unix seconds
}

message GetBucketSettingRequest {
    string bucket = 1;
    string name = 2;
}
message GetBucketSettingResponse {
    bool found = 1;
    bytes value = 2;
}
// `value` empty with `delete` set removes the setting.
message PutBucketSettingRequest {
    string bucket = 1;
    string name = 2;
    bytes value = 3;
    bool delete = 4;
}
message PutBucketSettingResponse {
    // Whether a setting was there before (for a delete: whether one was removed).
    bool existed = 1;
}

// ============================================================
// KMS Keys (for SSE-KMS)
// ============================================================

enum KmsKeyStatus {
    KMS_KEY_ENABLED = 0;
    KMS_KEY_DISABLED = 1;
    KMS_KEY_PENDING_DELETION = 2;
}

// A KMS key entry. The gateway never sends plaintext key material over
// the wire — `wrapped_key_material` is always encrypted by the gateway's
// service master key (env `OBJECTIO_MASTER_KEY`). Meta stores the blob
// verbatim and returns it on read; the gateway unwraps in-process.
message KmsKey {
    string key_id = 1;                 // Short id, e.g. "obj-2026-04-17-abc"
    string arn = 2;                    // arn:obio:kms:::{key_id}
    string description = 3;
    bytes wrapped_key_material = 4;    // Encrypted by service master key
    KmsKeyStatus status = 5;
    uint64 created_at = 6;
    uint64 updated_at = 7;
    string created_by = 8;             // User ARN that created the key
}

message CreateKmsKeyRequest {
    string key_id = 1;                 // Optional: server generates if empty
    string description = 2;
    bytes wrapped_key_material = 3;    // Already-wrapped 32 bytes
    string created_by = 4;
}
message CreateKmsKeyResponse { KmsKey key = 1; }

message GetKmsKeyRequest { string key_id = 1; }
message GetKmsKeyResponse { KmsKey key = 1; bool found = 2; }

message ListKmsKeysRequest {
    uint32 max_results = 1;
    string page_token = 2;
}
message ListKmsKeysResponse {
    repeated KmsKey keys = 1;
    string next_page_token = 2;
}

message DeleteKmsKeyRequest { string key_id = 1; }
message DeleteKmsKeyResponse { bool success = 1; }


// ---- Deduplication (objectio-docs architecture/design/dedup.md) ----

enum DedupMode {
    DEDUP_MODE_UNSET = 0;     // inherit
    DEDUP_MODE_OFF = 1;
    DEDUP_MODE_DRY_RUN = 2;   // fingerprint and count would-be savings; store as usual
    DEDUP_MODE_ON = 3;        // phase 2; refused until then
}

enum DedupScope {
    DEDUP_SCOPE_UNSET = 0;    // inherit
    DEDUP_SCOPE_BUCKET = 1;
    DEDUP_SCOPE_TENANT = 2;
    DEDUP_SCOPE_CLUSTER = 3;
}

// Mode and scope inherit separately: a bucket may set only its mode and
// take its scope from the tenant.
message DedupPolicy {
    DedupMode mode = 1;
    DedupScope scope = 2;
}

message SetBucketDedupRequest {
    string bucket = 1;
    DedupPolicy policy = 2;   // absent or all-unset: inherit everything
}
message SetBucketDedupResponse {}

// The policy at each level for `bucket`, and what they resolve to. With
// an empty bucket, just the cluster default.
message GetDedupPolicyRequest {
    string bucket = 1;
}
message GetDedupPolicyResponse {
    DedupPolicy bucket = 1;
    DedupPolicy tenant = 2;
    DedupPolicy cluster = 3;
    string tenant_name = 4;
    DedupMode effective_mode = 5;
    DedupScope effective_scope = 6;
    string effective_domain = 7;
    string mode_from = 8;     // "bucket" | "tenant" | "cluster" | "default"
    string scope_from = 9;
}

message LocateChunksRequest {
    string bucket = 1;
    repeated bytes fingerprints = 2;
}
message LocateChunksResponse {
    repeated string addresses = 1;   // primary OSD per fingerprint, in order; "" if none
    repeated bytes node_ids = 2;     // the same OSDs' node ids; empty if none
}

// ---- Shared stripes ----

// Who references a shared stripe: object ids (an object's, or a version's).
// Stored in meta's `stripe_refs` table, keyed by the stripe's object id in
// hex. A stripe with no entry has exactly one referrer, the object that
// wrote it.
message StripeRefs {
    repeated bytes referrers = 1;
}

// Make each stripe referenced by `sharer` as well as `owner`, the object
// it is copied from. FAILED_PRECONDITION if a stripe is already shared and
// `owner` is not among its referrers: the owner has let it go.
message ShareStripesRequest {
    repeated bytes stripe_ids = 1;
    bytes owner = 2;
    bytes sharer = 3;
}
message ShareStripesResponse {}

// `referrer` no longer references these stripes. `freeable` are those no
// one references any more — unshared ones, and shared ones whose last
// referrer this was — and only those may have their shards deleted.
message ReleaseStripesRequest {
    repeated bytes stripe_ids = 1;
    bytes referrer = 2;
}
message ReleaseStripesResponse {
    repeated bytes freeable = 1;
    // Packs whose last referrer this was: their records are gone (in the
    // same commit), and these are their stripes, for their shards to be
    // reclaimed.
    repeated StripeMeta freed_packs = 2;
}

// Record a pack about to be written (unsealed): its shards are known
// before any is written. ALREADY_EXISTS if the id is taken.
message IntendPackRequest { PackRecord pack = 1; }
message IntendPackResponse {}

// Seal a written pack and register its referrers, in one commit.
// FAILED_PRECONDITION unless it is recorded unsealed.
message SealPackRequest {
    bytes pack_id = 1;
    repeated bytes referrers = 2;   // the object ids packed into it
    // The stripe as written: where each shard landed. Replaces the
    // intended locations IntendPack recorded.
    StripeMeta stripe = 3;
}
message SealPackResponse {}

// Drop an unsealed pack's record (a pack abandoned before sealing); the
// record is returned so its written shards can be deleted. A sealed pack
// is refused.
message AbortPackRequest { bytes pack_id = 1; }
message AbortPackResponse { PackRecord pack = 1; bool found = 2; }

message GetPackRequest { bytes pack_id = 1; }
message GetPackResponse { PackRecord pack = 1; bool found = 2; }

message ListPacksRequest {
    bytes start_after = 1;
    uint32 limit = 2;
}
message ListPacksResponse {
    repeated PackRecord packs = 1;
    bool truncated = 2;
    // Per pack, in the same order: the object ids that reference it now
    // (the shared-stripe registry), so the caller can tell what's live.
    repeated PackReferrers referrers = 3;
}

message PackReferrers {
    repeated bytes object_ids = 1;
}

// A pack shard moved (drain, repair): the record's location for
// `position` changes from `from_node` to `to`, and its version is bumped.
message PackMoveShardRequest {
    bytes pack_id = 1;
    uint32 position = 2;
    bytes from_node = 3;
    ShardLocation to = 4;
}
message PackMoveShardResponse {}

// ---- Block storage metadata ----

// One chunk of a volume or snapshot: the erasure-coded stripe holding its
// bytes, and the referrer it holds that stripe as in the shared-stripe
// registry (the stripe's own id for a chunk the volume wrote itself, the
// snapshot's id, or a clone's volume id for a chunk it inherited).
message BlockChunkRef {
    uint64 chunk_id = 1;
    StripeMeta stripe = 2;
    bytes owner = 3;
}

message BlockCreateVolumeRequest {
    string name = 1;
    uint64 size_bytes = 2;
    string pool = 3;
    uint32 chunk_size_bytes = 4;   // 0 = 4 MiB
    map<string, string> metadata = 5;
}
message BlockVolumeResponse {
    objectio.block.Volume volume = 1;
}
// By id, or by name when the id is empty.
message BlockGetVolumeRequest {
    string volume_id = 1;
    string name = 2;
}
message BlockListVolumesRequest {}
message BlockListVolumesResponse {
    repeated objectio.block.Volume volumes = 1;
}
// Grow the volume (0 = unchanged) and/or set its state (UNKNOWN = unchanged).
message BlockUpdateVolumeRequest {
    string volume_id = 1;
    uint64 size_bytes = 2;
    objectio.block.VolumeState state = 3;
    // With a state set: whether the volume is attached read-only. Recorded
    // as the volume's `attached_read_only` (cleared by any other state), so
    // a restarted gateway exports it again the way it was attached.
    bool read_only = 4;
}
message BlockDeleteVolumeRequest {
    string volume_id = 1;
}
// Stripes no volume, snapshot or clone references any more: the caller
// deletes their shards.
message BlockReleaseResponse {
    repeated StripeMeta freeable = 1;
}

// Chunks [start, start + count) that are stored; unwritten ones are absent.
message BlockGetChunksRequest {
    string volume_id = 1;
    uint64 start_chunk = 2;
    uint64 count = 3;
}
message BlockGetChunksResponse {
    repeated BlockChunkRef chunks = 1;
}

// Point chunks at newly written stripes. Each update names the stripe it
// replaces (expected_object_id, empty for none), so a stale writer cannot
// overwrite a newer one: ABORTED if any does not match, and nothing is
// changed. The replaced stripes are released; those now unreferenced are
// returned to free.
message BlockChunkUpdate {
    uint64 chunk_id = 1;
    bytes expected_object_id = 2;
    StripeMeta stripe = 3;         // absent: the chunk is unwritten again (trim)
}
message BlockCommitChunksRequest {
    string volume_id = 1;
    repeated BlockChunkUpdate updates = 2;
}

message BlockCreateSnapshotRequest {
    string volume_id = 1;
    string name = 2;
}
message BlockSnapshotResponse {
    objectio.block.Snapshot snapshot = 1;
}
message BlockGetSnapshotRequest {
    string snapshot_id = 1;
}
// All snapshots, or a volume's when volume_id is set.
message BlockListSnapshotsRequest {
    string volume_id = 1;
}
message BlockListSnapshotsResponse {
    repeated objectio.block.Snapshot snapshots = 1;
}
message BlockDeleteSnapshotRequest {
    string snapshot_id = 1;
}
message BlockCloneVolumeRequest {
    string snapshot_id = 1;
    string name = 2;
}

// ---- Rolling upgrades ----

message ReportVersionRequest {
    string kind = 1;          // "meta", "osd", "gateway", "block-gateway"
    string id = 2;            // meta: Raft node id; osd: node id (hex); others: host:port
    string release = 3;
    uint32 format_level = 4;
    uint32 min_level = 5;
    string address = 6;
}

message ReportVersionResponse {
    uint32 active_level = 1;  // the level the cluster may write
}

message NodeVersion {
    string kind = 1;
    string id = 2;
    string release = 3;
    uint32 format_level = 4;
    uint32 min_level = 5;
    string address = 6;
    uint64 seen_secs_ago = 7;
}

message GetUpgradeStatusRequest {}

message GetUpgradeStatusResponse {
    uint32 active_level = 1;
    repeated NodeVersion nodes = 2;   // every node heard from recently
    uint32 finalize_to = 3;           // what finalize would raise the level to (= active_level: nothing to do)
    repeated string blockers = 4;     // why finalize would be refused now
}

message FinalizeUpgradeRequest {
    string requested_by = 1;
}

message FinalizeUpgradeResponse {
    uint32 active_level = 1;
}

// ============================================================
// Heal queue (object metadata at quorum)
// ============================================================

message HealEntry {
    string bucket = 1;
    string key = 2;
    // The version the write or delete was of; empty for an unversioned key.
    string version_id = 3;
    uint64 enqueued_at_ms = 4;
    // Who is healing it, until when (empty/0: nobody).
    string claimed_by = 5;
    uint64 claimed_until_ms = 6;
}

message HealEnqueueRequest {
    string bucket = 1;
    string key = 2;
    string version_id = 3;
}
message HealEnqueueResponse {}

message HealListRequest {
    uint32 limit = 1;
}
message HealListResponse {
    repeated HealEntry entries = 1;
}

// Claim `entry` (as listed) for `lease_ms`: refused if it changed since.
message HealClaimRequest {
    HealEntry entry = 1;
    string claimer = 2;
    uint64 lease_ms = 3;
}
message HealClaimResponse {
    bool claimed = 1;
    HealEntry entry = 2;
}

// Remove `entry` (as claimed): kept if it was enqueued again meanwhile.
message HealDoneRequest {
    HealEntry entry = 1;
}
message HealDoneResponse {
    bool done = 1;
}
