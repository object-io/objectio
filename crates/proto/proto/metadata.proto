// ============================================================
// Unity Catalog REST API Messages
// ============================================================

// Top-level Unity catalog. Auto-provisions a backing bucket "unity-{name}"
// for MANAGED tables; EXTERNAL tables may live in any bucket.
message UnityCatalog {
    string name        = 1;          // Globally unique catalog name (first level of catalog.schema.table)
    string comment     = 2;
    string owner       = 3;          // Principal that owns the catalog
    string bucket      = 4;          // Backing bucket for MANAGED tables (auto: "unity-{name}")
    string location    = 5;          // s3://{bucket} root for managed storage
    uint64 created_at  = 6;
    uint64 updated_at  = 7;
    map<string, string> properties = 8;
    string tenant      = 9;          // Owning tenant (empty = system)
    bytes  policy_json = 10;         // Catalog-level access policy (JSON-serialized BucketPolicy)
}

// Schema (second level). Belongs to exactly one catalog.
message UnitySchema {
    string catalog_name = 1;
    string name         = 2;         // Schema name within the catalog
    string comment      = 3;
    string owner        = 4;
    uint64 created_at   = 5;
    uint64 updated_at   = 6;
    map<string, string> properties = 7;
    bytes  policy_json  = 8;         // Schema-level access policy
}

// Table (third level). MANAGED tables auto-derive storage_location under the
// catalog's bucket; EXTERNAL tables accept a caller-supplied location.
message UnityTable {
    string catalog_name       = 1;
    string schema_name        = 2;
    string name               = 3;
    string table_id           = 4;   // Stable UUID (server-assigned at create)
    string table_type         = 5;   // "MANAGED" | "EXTERNAL" | "VIEW"
    string data_source_format = 6;   // "DELTA" | "ICEBERG" | "PARQUET" | "CSV" | "JSON"
    string storage_location   = 7;   // Full S3 URL (s3://bucket/key/)
    string columns_json       = 8;   // JSON-serialized Vec<UnityColumn> (column metadata)
    string owner              = 9;
    uint64 created_at         = 10;
    uint64 updated_at         = 11;
    map<string, string> properties = 12;
    bytes  policy_json        = 13;  // Table-level access policy
    // Row filter binding — UDF (catalog.schema.function_name) returning
    // BOOLEAN. Engine injects `WHERE function_name(input_columns)` into
    // every read of this table. Empty = no row filter.
    UnityRowFilter row_filter   = 14;
    // Column masks — per-column UDF transformation. Engine wraps every
    // read of `column_name` with `function_name(column_name, ...using_cols)`.
    // Map key = column name. Empty = no masks.
    map<string, UnityColumnMask> column_masks = 15;
}

message UnityRowFilter {
    // Fully-qualified function name: "catalog.schema.function".
    string function_full_name = 1;
    // Column names from the bound table that are passed to the function as
    // arguments. Order matches the function's parameter list.
    repeated string input_column_names = 2;
}

message UnityColumnMask {
    // Fully-qualified function name: "catalog.schema.function".
    string function_full_name = 1;
    // Optional extra columns the mask function reads (besides the masked
    // column itself, which is always the first argument).
    repeated string using_column_names = 2;
}

// ---- Catalog RPCs ----

message UnityCreateCatalogRequest {
    string name    = 1;
    string comment = 2;
    string owner   = 3;
    string tenant  = 4;
    map<string, string> properties = 5;
}
