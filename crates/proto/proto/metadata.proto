// ---- Table-security (row filter / column masks) bindings ----
//
// Set-and-replace semantics: every call replaces the table's bindings with
// what's in the request. To clear, send a request with empty `row_filter`
// and empty `column_masks`. Validated server-side (function must exist in
// the catalog and return BOOLEAN for row filter, etc.).
message UnitySetTableSecurityRequest {
    string catalog_name = 1;
    string schema_name  = 2;
    string name         = 3;
    UnityRowFilter row_filter = 4;
    map<string, UnityColumnMask> column_masks = 5;
}

message UnitySetTableSecurityResponse {
    UnityTable table = 1;
}

