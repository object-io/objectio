    string catalog_name = 1;
    string schema_name  = 2;
    string table_name   = 3;
}
message UnityGetTablePolicyResponse {
    bytes policy_json = 1;
}

// ============================================================
// Unity Catalog — Functions / Volumes / Models
// ============================================================
// These mirror the table layout (catalog → schema → entity) so handlers
// reuse the existing catalog/schema lookups + policy chain. Each entity
// is keyed by `{catalog}\x00{schema}\x00{name}` in its meta table.

// ---- Functions (UDFs) ----
// Pure metadata. No backing storage; the function source ships to the
// query engine (Spark / Trino / Databricks SQL) which executes it.
//
// Field names track the Databricks Unity Catalog REST spec exactly so
// the official Databricks SDK client works against this surface
// unmodified:
//   * `routine_definition` carries the source text (the SQL/code)
//   * `routine_body` carries the dispatch flag: "SQL" | "EXTERNAL"
//   * `external_language` carries the runtime language for EXTERNAL bodies
//     (e.g. "PYTHON"); empty for SQL.
message UnityFunction {
    string catalog_name      = 1;
    string schema_name       = 2;
    string name              = 3;
    string function_id       = 4;   // Server-assigned UUID
    string routine_definition = 5;  // Source text — the SQL/code body
    string routine_body      = 6;   // "SQL" | "EXTERNAL"
    string external_language = 7;   // Runtime for EXTERNAL bodies, e.g. "PYTHON"
    string data_type         = 8;   // Return type, e.g. "STRING" / "INT"
    string full_data_type    = 9;   // Verbose form, e.g. "DECIMAL(10,2)"
    string parameter_style   = 10;  // "S" (SQL standard) is the only common value
    bool   is_deterministic  = 11;
    string sql_data_access   = 12;  // "CONTAINS_SQL" | "READS_SQL_DATA" | "MODIFIES_SQL_DATA" | "NO_SQL"
    bool   is_null_call      = 13;
    string security_type     = 14;  // "DEFINER" | "INVOKER"
    string specific_name     = 15;  // Used by Spark — usually equals `name`
    string input_params_json = 16;  // JSON: {"parameters": [...]} per Databricks spec
    string return_params_json = 17; // JSON: {"parameters": [...]} per Databricks spec
    string comment           = 18;
    string owner             = 19;
    uint64 created_at        = 20;
    uint64 updated_at        = 21;
    map<string, string> properties = 22;
}

message UnityCreateFunctionRequest {
    string catalog_name      = 1;
    string schema_name       = 2;
    string name              = 3;
    string routine_definition = 4;
    string routine_body      = 5;   // "SQL" | "EXTERNAL"
    string external_language = 6;
    string data_type         = 7;
    string full_data_type    = 8;
    string parameter_style   = 9;
    bool   is_deterministic  = 10;
    string sql_data_access   = 11;
    bool   is_null_call      = 12;
    string security_type     = 13;
    string specific_name     = 14;
    string input_params_json = 15;
    string return_params_json = 16;
    string comment           = 17;
    string owner             = 18;
    map<string, string> properties = 19;
}
message UnityCreateFunctionResponse { UnityFunction function = 1; }

message UnityListFunctionsRequest {
    string catalog_name = 1;
    string schema_name  = 2;
    uint32 max_results  = 3;
    string page_token   = 4;
}
message UnityListFunctionsResponse {
    repeated UnityFunction functions = 1;
    string next_page_token            = 2;
}

message UnityGetFunctionRequest {
    string catalog_name = 1;
    string schema_name  = 2;
    string name         = 3;
}
message UnityGetFunctionResponse { UnityFunction function = 1; }

message UnityDeleteFunctionRequest {
    string catalog_name = 1;
    string schema_name  = 2;
    string name         = 3;
}
message UnityDeleteFunctionResponse { bool success = 1; }

// ---- Volumes ----
// Governed S3 prefixes for non-tabular data (model artifacts, training
// inputs, libraries). MANAGED → server-derived `unity-{catalog}/{schema}/__volumes/{name}/`;
// EXTERNAL → caller-supplied location.
message UnityVolume {
    string catalog_name     = 1;
    string schema_name      = 2;
    string name             = 3;
    string volume_id        = 4;     // Server-assigned UUID
    string volume_type      = 5;     // "MANAGED" | "EXTERNAL"
    string storage_location = 6;     // s3://bucket/prefix/
    string comment          = 7;
    string owner            = 8;
    uint64 created_at       = 9;
    uint64 updated_at       = 10;
    map<string, string> properties = 11;
}

message UnityCreateVolumeRequest {
    string catalog_name     = 1;
    string schema_name      = 2;
    string name             = 3;
    string volume_type      = 4;
    string storage_location = 5;     // Required for EXTERNAL; ignored for MANAGED.
    string comment          = 6;
    string owner            = 7;
    map<string, string> properties = 8;
}
message UnityCreateVolumeResponse { UnityVolume volume = 1; }

message UnityListVolumesRequest {
    string catalog_name = 1;
    string schema_name  = 2;
    uint32 max_results  = 3;
    string page_token   = 4;
}
message UnityListVolumesResponse {
    repeated UnityVolume volumes = 1;
    string next_page_token        = 2;
}

message UnityGetVolumeRequest {
    string catalog_name = 1;
    string schema_name  = 2;
    string name         = 3;
}
message UnityGetVolumeResponse { UnityVolume volume = 1; }

message UnityDeleteVolumeRequest {
    string catalog_name = 1;
    string schema_name  = 2;
    string name         = 3;
}
message UnityDeleteVolumeResponse { bool success = 1; }

// ---- Models (registered ML models) + Versions ----
// MLflow-shaped two-level entity. The Model has metadata; each
// ModelVersion points at a `source` URI containing the artifacts. We do
// not host the artifacts — same pattern as Tables/Volumes, just
// version-aware.
message UnityModel {
    string catalog_name     = 1;
    string schema_name      = 2;
    string name             = 3;
    string model_id         = 4;     // Server-assigned UUID
    string storage_location = 5;     // Default `s3://unity-{catalog}/{schema}/__models/{name}/` for MANAGED
    string comment          = 6;
    string owner            = 7;
    uint64 created_at       = 8;
    uint64 updated_at       = 9;
    map<string, string> properties = 10;
}

message UnityModelVersion {
    string catalog_name     = 1;
    string schema_name      = 2;
    string model_name       = 3;
    uint32 version          = 4;     // 1-indexed, monotonic per model
