[package]
name = "objectio-proto"
description = "Protocol buffer definitions for ObjectIO"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
objectio-common = { workspace = true }
tower = { workspace = true }
tonic = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
# A stripe's shard writes run at once (`stripe::write`).
futures = { workspace = true }
# tonic 0.12's balanced channel takes tower 0.4's `Change`.
tower04 = { package = "tower", version = "0.4", default-features = false, features = ["discover"] }
prost = { workspace = true }
prost-types = { workspace = true }
serde_json = { workspace = true }
clap = { workspace = true }
parking_lot = { workspace = true }
# The roles a peer's certificate names in its SAN URIs (peer_auth.rs):
# rustls checks the chain but doesn't expose URIs. The parser rcgen uses.
x509-parser = { version = "0.16", default-features = false }
tokio-rustls = { workspace = true }
# The TCP connector handed to tonic's `connect_with_connector`, so that the
# connect timeout covers the TLS handshake too (transport::connect).
hyper-util = { version = "0.1", features = ["client-legacy", "tokio"] }

[dev-dependencies]
rcgen = "0.13"

[build-dependencies]
tonic-build = "0.12"
