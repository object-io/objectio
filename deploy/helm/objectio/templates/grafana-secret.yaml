{{- if and .Values.monitoring.enabled (not .Values.monitoring.grafana.existingSecret) }}
{{- $name := include "objectio.grafana.fullname" . -}}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "objectio.labels" . | nindent 4 }}
    app.kubernetes.io/component: grafana
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
data:
  # The value given; else the password already made; else a new one.
  {{- if .Values.monitoring.grafana.adminPassword }}
  admin-password: {{ .Values.monitoring.grafana.adminPassword | b64enc | quote }}
  {{- else if and $existing (index $existing.data "admin-password") }}
  admin-password: {{ index $existing.data "admin-password" | quote }}
  {{- else }}
  admin-password: {{ randAlphaNum 24 | b64enc | quote }}
  {{- end }}
{{- end }}
