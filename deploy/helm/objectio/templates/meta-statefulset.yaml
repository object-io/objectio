apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "objectio.meta.fullname" . }}
  labels:
    {{- include "objectio.labels" . | nindent 4 }}
    app.kubernetes.io/component: meta
spec:
  serviceName: {{ include "objectio.meta.headless" . }}
  replicas: {{ .Values.meta.replicas }}
  # All pods start together: a pod is ready only with a quorum (a leader
  # known), so starting them one after another, each waiting for the last
  # to be ready, would never get past the first after a full restart.
  # Updates still roll one pod at a time, each waiting for readiness.
  podManagementPolicy: Parallel
  selector:
    matchLabels:
      {{- include "objectio.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: meta
  template:
    metadata:
      labels:
        {{- include "objectio.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: meta
      {{- with .Values.meta.podAnnotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
    spec:
      {{- with (include "objectio.podPlacement" (dict "root" . "values" .Values.meta "component" "meta") | trim) }}
      {{- . | nindent 6 }}
      {{- end }}
      containers:
        - name: meta
          image: {{ include "objectio.image" (dict "global" .Values.global "component" .Values.meta) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              ORDINAL=$(echo "$HOSTNAME" | rev | cut -d- -f1 | rev)
              NODE_ID=$((ORDINAL + 1))
              # Advertise address peers dial for Raft — stable pod DNS
              # from the headless service. `$HOSTNAME` is the pod name.
              ADVERTISE="$HOSTNAME.{{ include "objectio.meta.headless" . }}:{{ .Values.meta.service.port }}"
              exec objectio-meta \
                --node-id "$NODE_ID" \
                --listen "0.0.0.0:{{ .Values.meta.service.port }}" \
                --raft-advertise "$ADVERTISE" \
                --admin-port {{ .Values.meta.service.adminPort }} \
                --metrics-port {{ .Values.meta.service.metricsPort }} \
                --peers "{{ include "objectio.metaPeers" . }}" \
                --data-dir /var/lib/objectio/meta \
              {{- if .Values.replication }}
                --replication "{{ .Values.replication }}" \
              {{- else }}
                --ec-k "{{ .Values.ec.k }}" \
                --ec-m "{{ .Values.ec.m }}" \
              {{- end }}
                --log-level "{{ .Values.meta.logLevel }}"
          {{- with (include "objectio.tls.env" .) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: grpc
              containerPort: {{ .Values.meta.service.port }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.meta.service.metricsPort }}
              protocol: TCP
            - name: admin
              containerPort: {{ .Values.meta.service.adminPort }}
              protocol: TCP
          {{- with (include "objectio.probes" (dict "values" .Values.meta) | trim) }}
          {{- . | nindent 10 }}
          {{- end }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/objectio
            {{- with (include "objectio.tls.volumeMount" .) }}
            {{- . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.meta.resources | nindent 12 }}
      {{- with (include "objectio.tls.volume" .) }}
      volumes:
        {{- . | nindent 8 }}
      {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.meta.persistence.storageClass }}
        storageClassName: {{ .Values.meta.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.meta.persistence.size }}
