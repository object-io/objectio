[package]
name = "objectio-e2e"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

# The harness boots `objectio-aio` as a child process and drives it over
# HTTP, so it deliberately does not depend on any workspace crate — it tests
# the system the way a client sees it, not the way the code is arranged.
[dependencies]
reqwest = { workspace = true, features = ["blocking", "json"] }
serde_json = { workspace = true }
sha2 = { workspace = true }
hmac = { workspace = true }
hex = { workspace = true }
base64 = { workspace = true }
md-5 = { workspace = true }
tempfile = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true }
objectio-proto = { workspace = true }
objectio-common = { workspace = true }
ring = { workspace = true }
# A CA and a node certificate for mTLS between the services (src/tls.rs).
rcgen = "0.13"
# S3 Select (tests/s3_select.rs): Parquet, GZIP and BZIP2 objects to query,
# and the event stream's CRCs. The same features as the gateway's parquet,
# so the build is shared.
parquet = { version = "60", default-features = false, features = ["snap", "brotli", "flate2-zlib-rs", "lz4", "zstd", "simdutf8"] }
flate2 = "1"
bzip2 = "0.6"
crc32fast = "1.4"

[dev-dependencies]
# meta_reopen grows a stopped meta node's database to a size worth timing a
# crash at (B25): through S3 it would take hours.
redb = { workspace = true }

[lints]
workspace = true
