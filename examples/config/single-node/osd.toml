# ObjectIO OSD Configuration - Single Node Deployment
#
# One OSD on one server, with several drives. An OSD holds at most one
# shard of a stripe, so this one keeps a single copy of each object (meta
# --replication 1). To erasure-code on one server, run one OSD per drive.

[osd]
# Human-readable name for this OSD instance
node_name = "osd-single-01"

# gRPC listen address
listen = "0.0.0.0:9200"

# Metadata service endpoint
meta_endpoint = "http://localhost:9100"

# Placement weight: read, but placement doesn't use it yet (every OSD
# weighs the same)
weight = 1.0

# Failure domain - where this OSD sits in the topology
# For single-node: all OSDs share the same region/datacenter/rack (and host)
[osd.failure_domain]
region = "default"
datacenter = "dc1"
rack = "rack1"

[storage]
# List of disk paths managed by this OSD
# Each path should be a dedicated disk or partition
disks = [
    "/mnt/nvme0",
    "/mnt/nvme1",
    "/mnt/nvme2",
    "/mnt/nvme3",
    "/mnt/nvme4",
    "/mnt/nvme5",
]

# OSD metadata directory (WAL, object index, etc.)
data_dir = "/var/lib/objectio/osd"

[logging]
level = "info"
