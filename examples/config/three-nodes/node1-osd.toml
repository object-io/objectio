# ObjectIO OSD Configuration - Three Node Deployment (Node 1)
#
# Three-node deployment with each node in a different rack, one OSD per
# node: EC 2+1 survives one node or rack. Wider codes need more OSDs (one
# per drive).

[osd]
node_name = "osd-node1"
listen = "0.0.0.0:9200"
meta_endpoint = "http://meta.objectio.local:9100"
weight = 1.0

# Node 1 is in rack-01
# A pool spread over racks puts each shard in a different one
[osd.failure_domain]
region = "us-east"
datacenter = "dc1"
rack = "rack-01"

[storage]
# 12 disks per node = 36 disks total
disks = [
    "/mnt/nvme0",
    "/mnt/nvme1",
    "/mnt/nvme2",
    "/mnt/nvme3",
    "/mnt/nvme4",
    "/mnt/nvme5",
    "/mnt/nvme6",
    "/mnt/nvme7",
    "/mnt/nvme8",
    "/mnt/nvme9",
    "/mnt/nvme10",
    "/mnt/nvme11",
]
data_dir = "/var/lib/objectio/osd"

[logging]
level = "info"
