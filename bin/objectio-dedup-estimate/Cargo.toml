[package]
name = "objectio-dedup-estimate"
description = "Estimate what deduplication would save on a set of files, offline"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "objectio-dedup-estimate"
path = "src/main.rs"

# Uses the gateway's own chunking and fingerprints, so its numbers are
# what the dry-run, and phase 2, would see on the same bytes.
[dependencies]
anyhow = { workspace = true }
clap = { workspace = true }
objectio-gateway = { path = "../objectio-gateway" }

[lints]
workspace = true
