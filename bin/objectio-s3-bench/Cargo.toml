[package]
name = "objectio-s3-bench"
description = "PUT/GET load generator that splits request time into encode, shard transfer and disk"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[[bin]]
name = "objectio-s3-bench"
path = "src/main.rs"

# Talks to the gateway over HTTP only, like any S3 client, so it can be
# pointed at aio on a laptop or at a real cluster on RDMA hardware.
[dependencies]
anyhow = { workspace = true }
bytes = { workspace = true }
clap = { workspace = true }
futures = { workspace = true }
hex = { workspace = true }
hmac = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
sha2 = { workspace = true }
tokio = { workspace = true }

[lints]
workspace = true
