# Rust CI — formatting, lints, unit tests, and the end-to-end smoke test.
#
# This did not exist. The only workflows were a manual release and three
# that fire on `sdk/**`, so `cargo test` never ran anywhere but a developer's
# laptop: a pull request could break the build, fail every test, and nothing
# would say so. The workspace already had 448 unit tests and a `make ci`
# target; nothing invoked them.
#
# Jobs are split so a failure names itself — "fmt" and "clippy" are cheap and
# fail fast, "test" is the bulk, and "e2e" is the slow one that boots a real
# cluster. Splitting also means a formatting nit does not hide a test failure
# behind it.
#
# Not using `make ci` directly: it runs fmt → lint → test in one sequence, so
# the first failure masks the rest. Same commands, run independently.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  # A new push supersedes an in-flight run for the same ref. Saves minutes on
  # a branch being pushed to repeatedly.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Keep the cache useful without blowing the size limit: debug info is the
  # bulk of target/ and the tests do not need it.
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # The workspace sets clippy::all + pedantic + nursery in Cargo.toml and
      # the Makefile passes -D warnings; match it rather than letting CI be
      # laxer than the local command.
      - run: cargo clippy --workspace --all-targets -- -D warnings

  test:
    name: unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # Excluding the e2e package: it boots a cluster and belongs in its own
      # job so its runtime and its failures stay legible.
      - run: cargo test --workspace --exclude objectio-e2e

  e2e:
    name: end-to-end
    runs-on: ubuntu-latest
    # Boots a real single-process cluster and drives it over HTTP, so it is
    # slower than everything above put together.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      # aio embeds console/dist. build.rs creates it empty when absent so a
      # clone still builds, but the e2e job should exercise the real thing.
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: build the console aio embeds
        working-directory: console
        run: npm ci && npm run build
      - name: build the aio binary the tests drive
        run: cargo build --bin objectio-aio
      - name: run
        run: cargo test --package objectio-e2e -- --test-threads=1 --nocapture

  image:
    name: docker image
    runs-on: ubuntu-latest
    # The image build broke the moment tests/e2e became a workspace member —
    # cargo would not read the workspace without its manifest, so `cargo fetch`
    # failed before compiling anything — and stayed broken for five commits
    # because nothing here ever built it. The test jobs above compile the
    # workspace from a checkout; only this compiles it the way a release does,
    # from the paths the Dockerfile chooses to COPY.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: build
        uses: docker/build-push-action@v6
        with:
          context: .
          # The builder stage is the one that can break: it compiles every
          # binary. The runtime stages only copy the results out.
          target: builder
          push: false
          # Layer cache across runs, so an unchanged dependency graph does not
          # pay for a cold Rust build every time.
          cache-from: type=gha
          cache-to: type=gha,mode=max

  chart:
    name: helm chart
    runs-on: ubuntu-latest
    # Nothing validated the chart. A broken template, a values key that no
    # longer exists, or an image the registry does not carry were all
    # discovered by `publish-chart` at the end of a release — after the
    # version bump had already been committed and tagged.
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
        with:
          version: v3.16.2

      - name: lint
        run: helm lint deploy/helm/objectio --strict

      # Render with the defaults a published install gets, and with the kind
      # overlay, because the two take different branches of the image helper.
      - name: render
        run: |
          set -euo pipefail
          helm template objectio deploy/helm/objectio > /tmp/default.yaml
          helm template objectio deploy/helm/objectio \
            --values deploy/kind/values.yaml > /tmp/kind.yaml
          for f in /tmp/default.yaml /tmp/kind.yaml; do
            echo "$f: $(grep -c '^kind:' "$f") resources"
          done

      # The check that matters: a default install must only ask for images
      # this project actually publishes. The release pushes exactly one —
      # the Dockerfile's `all` target — and the chart shipped asking for
      # per-service images (objectio-gateway, objectio-meta, objectio-osd)
      # that have never existed in any registry, so `helm install` from the
      # published chart sat in ImagePullBackOff.
      - name: every own-registry image is one we publish
        run: |
          set -euo pipefail
          OWNER='${{ github.repository_owner }}'
          bad=0
          while read -r img; do
            case "$img" in
              ghcr.io/$OWNER/objectio:*) ;;
              ghcr.io/$OWNER/*)
                echo "::error::default install references $img, which the release does not publish"
                bad=1 ;;
            esac
          done < <(grep -oE 'image: \S+' /tmp/default.yaml | awk '{print $2}' | sort -u)
          [ "$bad" -eq 0 ]

      - name: package
        run: helm package deploy/helm/objectio --destination /tmp/chart && ls -lh /tmp/chart

  aio-release-build:
    name: aio (release features)
    runs-on: ubuntu-latest
    # The release compiles objectio-aio with feature flags nothing else turns
    # on — ISA-L erasure coding, io_uring, the PCRE2 and Hyperscan grep
    # engines. A cfg-gated path that no longer compiles under those is
    # invisible until a release is half-done: the version bump and tag land in
    # `prepare`, and the binary build fails after.
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler pkg-config libpcre2-dev \
            nasm autoconf automake libtool libclang-dev
      # aio embeds console/dist; build.rs creates it empty when absent, which
      # is enough to compile. Debug profile: this links, which is the point,
      # and the linkage is the same as release without paying for optimisation.
      - name: build with the release feature set
        run: |
          cargo build --bin objectio-aio \
            --features isal,io-uring,grep-pcre2

      # The release binary is downloaded and run on machines that are not this
      # runner. v0.0.1's linux-amd64 build succeeded here and then failed on
      # startup everywhere else with
      #   error while loading shared libraries: libhs.so.5
      # because --features grep-hyperscan links Hyperscan dynamically and
      # nothing ships it. A build that passes is not the same as an artifact
      # that runs, and only this distinguishes them.
      - name: the binary links nothing exotic
        run: |
          set -euo pipefail
          ALLOWED='libc|libm|libgcc_s|libpthread|libdl|librt|ld-linux|linux-vdso|libpcre2-8|libssl|libcrypto'
          echo "--- ldd ---"; ldd target/debug/objectio-aio
          bad=$(ldd target/debug/objectio-aio \
                | awk '{print $1}' \
                | grep -vE "^($ALLOWED)" \
                | grep -E '^lib|^ld-' || true)
          if [ -n "$bad" ]; then
            echo "::error::the release binary needs libraries a user will not have: $bad"
            exit 1
          fi
          echo "only portable libraries — ok",grep-hyperscan

  console:
    name: console
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: console/package-lock.json
      - working-directory: console
        run: npm ci
      - working-directory: console
        run: npm run lint
      # tsc runs as part of the build, so this covers type errors too.
      - working-directory: console
        run: npm run build
