# Tests both SDKs on every change to sdk/.
#
# The mirror workflow gates on the Go build too, but that only runs on main.
# This runs on pull requests, which is where a break should be caught — the
# module is published to a separate repo, so a bad commit on main is a bad
# release waiting for someone to click "Run workflow".
#
# The signature tests are the point: the Go and Python SigV4 implementations
# are pinned to the same vectors, and two implementations of one algorithm
# drift silently. Neither suite needs a running gateway.

name: SDK

on:
  push:
    branches: [main]
    paths: ['sdk/**', '.github/workflows/sdk-ci.yml']
  pull_request:
    paths: ['sdk/**', '.github/workflows/sdk-ci.yml']

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'
          cache-dependency-path: sdk/go/go.mod
      - name: gofmt
        working-directory: sdk/go
        run: test -z "$(gofmt -l .)" || { gofmt -d .; exit 1; }
      - name: vet
        working-directory: sdk/go
        run: go vet ./...
      - name: test
        working-directory: sdk/go
        run: go test -race ./...
      # The selling point is that it has none; a dependency creeping in
      # should fail loudly rather than be noticed at import time by someone
      # vendoring it into a CSI driver.
      - name: assert the module has no dependencies
        working-directory: sdk/go
        run: |
          deps="$(go list -m all | tail -n +2)"
          if [ -n "$deps" ]; then
            echo "expected no dependencies, found:" >&2
            echo "$deps" >&2
            exit 1
          fi

  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.12']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: install
        working-directory: sdk/python
        run: |
          python -m pip install --upgrade pip
          pip install -e '.[dev]'
      - name: test
        working-directory: sdk/python
        run: python -m pytest tests -q
      - name: assert the package has no runtime dependencies
        working-directory: sdk/python
        run: |
          deps="$(pip show objectio | sed -n 's/^Requires: //p')"
          if [ -n "$deps" ]; then
            echo "expected no runtime dependencies, found: $deps" >&2
            exit 1
          fi
