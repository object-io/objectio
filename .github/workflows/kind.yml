# The helm chart on kind, and meta HA under it (roadmap A5): 3 metas,
# 6 OSDs, a gateway; S3 traffic while the meta leader's pod is killed,
# then a follower's, then the StatefulSet rolled. Every acknowledged write
# must read back intact (deploy/kind/meta-ha-test.sh).
#
# It builds the images, so it runs nightly, on demand, and on pull
# requests that touch the chart, the kind setup or meta.
name: kind

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - deploy/helm/**
      - deploy/kind/**
      - crates/meta/**
      - bin/meta/**
      - crates/meta-store/**
      - .github/workflows/kind.yml

concurrency:
  group: kind-${{ github.ref }}
  cancel-in-progress: true

jobs:
  meta-ha:
    name: meta HA on kind
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: helm/kind-action@v1
        with:
          install_only: true
      - uses: azure/setup-helm@v4
      - name: cluster and chart (builds the images)
        run: deploy/kind/setup.sh
      - name: every pod ready
        run: kubectl -n objectio wait --for=condition=Ready pod --all --field-selector=status.phase=Running --timeout=600s
      - name: meta HA
        run: deploy/kind/meta-ha-test.sh
      - name: state on failure
        if: failure()
        run: |
          kubectl -n objectio get pods -o wide
          for p in $(kubectl -n objectio get pods -o name); do
            echo "== $p"; kubectl -n objectio logs "$p" --all-containers --tail=80 || true
          done
