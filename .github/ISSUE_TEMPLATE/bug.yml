name: Bug
description: Something ObjectIO does wrong.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        A security problem? Don't file it here: report it privately (SECURITY.md).
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead. Exact commands or requests, and error messages as text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: How to reproduce it
      description: The smallest steps that show it, from a fresh cluster if you can (`objectio-aio` is the quickest).
    validations:
      required: true
  - type: input
    id: release
    attributes:
      label: Release
      description: "`objectio-gateway --version`, the image tag, or the commit you built."
    validations:
      required: true
  - type: textarea
    id: deployment
    attributes:
      label: Deployment
      description: objectio-aio, binaries or Helm; nodes and disks; the pool's erasure-coding scheme; OS and architecture; the client (aws-cli, boto3, an SDK) and its version.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: The gateway, meta or OSD logs around the time it happened. Remove keys and other secrets first.
      render: text
  - type: dropdown
    id: data
    attributes:
      label: Was data lost or wrong?
      description: Objects missing, unreadable, or different from what was written.
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
